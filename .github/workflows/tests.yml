name: Tests

# The shell lint and this repository's own test suite. Split out of the former
# ci.yml, which carried five unrelated concerns in one file: the suite, pull
# request hygiene, and three freshness watchers. They fail for different
# reasons and are read by different people.
#
# The job id stays `shell`. A required status check is named
# `<caller job id> / <inner job name>`, and the FILE is not part of that name,
# so moving this job to its own workflow leaves `shell / test` and
# `shell / shellcheck` exactly as the ruleset requires them. Renaming the job
# would create two phantom required checks and block every pull request, which
# is why it did not happen for tidiness.
#
# The suite is listed one per line. As a single line it grew past the width of
# any terminal, and tests/ci/policy/locale-pinned.test.sh was dropped from it without
# anyone noticing -- it sat in tests/, passed by hand, and CI never ran it.
# tests/ci/suites/ci-runs-every-test.test.sh now fails when that happens again.
#
# The first item is the runner and the rest are its arguments. A `&&` chain
# cannot tell a suite that ran every assertion from one that exited early
# having run three: both leave a zero status and the chain moves on. Every
# test file now ends by printing a sentinel after its last assertion, and
# tests/ci/suites/check-suite-completeness.test.sh requires one from every file it was
# given, naming the file that did not produce one.
#
# Order is roughly cheapest-first, so a broken fixture surfaces before the
# suites that build .debs and shell out to gpg.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shell:
    uses: ./.github/workflows/reusable-shell-ci.yml
    with:
      # Only prose the suite does not read. README.md is read by
      # readme-bootstrap, keyring-fingerprints, build-index-page and
      # distro-floor, and docs/ by readme-bootstrap, so neither is listed;
      # tests/ci/suites/shell-ci-scope.test.sh fails if this list grows to a file the
      # suite reads.
      skip-suite-paths: CONTRIBUTING.md
      test-command: >-
        ./tests/ci/suites/check-suite-completeness.test.sh
        ./tests/verify/verify-debs.test.sh
        ./tests/verify/verify-published.test.sh
        ./tests/build/build-keyring.test.sh
        ./tests/keyring/glyndor-upgrade.test.sh
        ./tests/build/build-repo.test.sh
        ./tests/publish/purge-cache.test.sh
        ./tests/build/build-index-page.test.sh
        ./tests/build/build-installers.test.sh
        ./tests/installer/install-template.test.sh
        ./tests/installer/install-template-behaviour.test.sh
        ./tests/installer/unattended-upgrades.test.sh
        ./tests/build/architectures-agree.test.sh
        ./tests/installer/readme-bootstrap.test.sh
        ./tests/keyring/keyring-fingerprints.test.sh
        ./tests/publish/publish-workflow.test.sh
        ./tests/publish/health-check-workflow.test.sh
        ./tests/verify/distro-floor.test.sh
        ./tests/ci/policy/locale-pinned.test.sh
        ./tests/quality/check-test-coverage.test.sh
        ./tests/ci/suites/ci-runs-every-test.test.sh
        ./tests/quality/lint-workflow-shell.test.sh
        ./tests/ci/reusable/reusable-line-limit.test.sh
        ./tests/ci/reusable/reusable-shell-ci.test.sh
        ./tests/ci/suites/shell-ci-scope.test.sh
        ./tests/ci/policy/cancel-policy.test.sh
        ./tests/ci/reusable/reusable-empty-diff.test.sh
        ./tests/ci/reusable/reusable-dco.test.sh
        ./tests/quality/check-editorconfig.test.sh
        ./tests/monitoring/check-reusable-drift.test.sh
        ./tests/ci/policy/jobs-are-bounded.test.sh
        ./tests/ci/policy/workflow-shape.test.sh
        ./tests/ci/policy/network-calls-are-bounded.test.sh
        ./tests/ci/reusable/reusable-dependabot-freshness.test.sh
        ./tests/ci/reusable/reusable-schedule-freshness.test.sh
        ./tests/monitoring/check-suite-on-main.test.sh
        ./tests/ci/reusable/reusable-workflow-lint.test.sh
      # shellcheck: tests/quality/lint-workflow-shell.test.sh plants a violation and
      # requires the linter to report it, so it needs the linter. The gate
      # itself runs in the shellcheck job against the pinned binary; this one
      # asserts behaviour, which does not turn on the exact version.
      # python3-yaml: the tooling-isolation step tests/ci/reusable/reusable-workflow-lint.test.sh
      # executes imports it, exactly as the workflow-lint job installs it.
      apt-packages: python3-cryptography reprepro shellcheck python3-yaml
