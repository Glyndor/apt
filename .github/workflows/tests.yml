name: Tests

# The shell lint and this repository's own test suite. Split out of the former
# ci.yml, which carried five unrelated concerns in one file: the suite, pull
# request hygiene, and three freshness watchers. They fail for different
# reasons and are read by different people.
#
# The job id stays `shell`. A required status check is named
# `<caller job id> / <inner job name>`, and the FILE is not part of that name,
# so moving this job to its own workflow leaves `shell / test` and
# `shell / shellcheck` exactly as the ruleset requires them. Renaming the job
# would create two phantom required checks and block every pull request, which
# is why it did not happen for tidiness.
#
# The suite is listed one per line. As a single line it grew past the width of
# any terminal, and tests/ci/policy/locale-pinned.test.sh was dropped from it without
# anyone noticing -- it sat in tests/, passed by hand, and CI never ran it.
# tests/ci/suites/ci-runs-every-test.test.sh now fails when that happens again.
#
# The first item is the runner and the rest are its arguments. A `&&` chain
# cannot tell a suite that ran every assertion from one that exited early
# having run three: both leave a zero status and the chain moves on. Every
# test file now ends by printing a sentinel after its last assertion, and
# tests/ci/suites/check-suite-completeness.test.sh requires one from every file it was
# given, naming the file that did not produce one.
#
# Order is roughly cheapest-first, so a broken fixture surfaces before the
# suites that build .debs and shell out to gpg.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shell:
    uses: ./.github/workflows/reusable-shell-ci.yml
    with:
      # No path is skippable here. check-editorconfig walks every tracked file
      # (git ls-files), so every file, CONTRIBUTING.md included, is an input of
      # the suite's verdict: a pull request that only edited it and dropped its
      # final newline would have merged without the one check that reads it.
      # tests/ci/suites/shell-ci-scope.test.sh fails if this list is not empty
      # while that walk exists, or names a file the suite reads.
      test-command: >-
        ./tests/ci/suites/check-suite-completeness.test.sh
        ./tests/mutation/run-mutations.test.sh
        ./tests/quality/check-mutation-coverage.test.sh
        ./tests/quality/mutation-scope.test.sh
        ./tests/ci/policy/mutation-workflow.test.sh
        ./tests/verify/verify-debs.test.sh
        ./tests/verify/verify-debs-hybrid.test.sh
        ./tests/verify/verify-published.test.sh
        ./tests/verify/verify-published/verify-published-bootstrap.test.sh
        ./tests/verify/verify-published/verify-published-budget.test.sh
        ./tests/verify/verify-published/verify-published-object-size.test.sh
        ./tests/verify/verify-published/verify-published-packages.test.sh
        ./tests/verify/verify-published/verify-published-build.test.sh
        ./tests/verify/verify-published/verify-published-collision.test.sh
        ./tests/verify/check-release-order.test.sh
        ./tests/verify/verify-installers.test.sh
        ./tests/verify/reference-installers.test.sh
        ./tests/verify/published-roster.test.sh
        ./tests/verify/roster-has-releases.test.sh
        ./tests/ci/policy/roster-releases-workflow.test.sh
        ./tests/ci/policy/workflows-run-their-scripts.test.sh
        ./tests/build/build-keyring.test.sh
        ./tests/build/keyring/build-keyring-generator.test.sh
        ./tests/build/keyring/build-keyring-contents.test.sh
        ./tests/keyring/glyndor-upgrade.test.sh
        ./tests/keyring/maintainer-postinst-trust.test.sh
        ./tests/keyring/glyndor-upgrade-errors.test.sh
        ./tests/keyring/maintainer-timer.test.sh
        ./tests/keyring/maintainer-offer-guards.test.sh
        ./tests/keyring/maintainer-prerm.test.sh
        ./tests/keyring/release-key.test.sh
        ./tests/keyring/maintainer-postrm.test.sh
        ./tests/build/build-repo.test.sh
        ./tests/build/build-repo-expiry.test.sh
        ./tests/publish/purge-cache.test.sh
        ./tests/publish/purge-cache/purge-cache-budget.test.sh
        ./tests/publish/purge-cache/purge-cache-guards.test.sh
        ./tests/build/build-index-page.test.sh
        ./tests/build/build-installers.test.sh
        ./tests/installer/install-template.test.sh
        ./tests/installer/install-template/install-template-behaviour.test.sh
        ./tests/installer/install-template/install-template-empty-keyring.test.sh
        ./tests/installer/install-template/install-template-special-files.test.sh
        ./tests/installer/install-template/install-template-limits.test.sh
        ./tests/installer/install-template/install-template-hostile-tar.test.sh
        ./tests/installer/install-template/install-template-redirect.test.sh
        ./tests/installer/install-template/install-template-tmpdir.test.sh
        ./tests/installer/install-template/install-template-delivery.test.sh
        ./tests/installer/install-template/install-template-guards.test.sh
        ./tests/installer/install-template/install-template-swap.test.sh
        ./tests/installer/unattended-upgrades.test.sh
        ./tests/build/architectures-agree.test.sh
        ./tests/installer/readme-bootstrap.test.sh
        ./tests/keyring/keyring-fingerprints.test.sh
        ./tests/publication/publish/publish-workflow.test.sh
        ./tests/publication/publish/publish-workflow-sync.test.sh
        ./tests/publication/publish/publish-workflow-assets.test.sh
        ./tests/publication/publish/publish-workflow-pq-sidecar.test.sh
        ./tests/publication/publish/publish-workflow-mldsa-venv.test.sh
        ./tests/publication/publish/publish-workflow-verify-debs.test.sh
        ./tests/publication/publish/publish-workflow-release-order.test.sh
        ./tests/publication/publish/publish-workflow-bootstrap.test.sh
        ./tests/publication/publish/publish-workflow-signing-key.test.sh
        ./tests/publish/sync-archive.test.sh
        ./tests/publish/prune-installers.test.sh
        ./tests/publish/purge-cache/purge-cache-pruned.test.sh
        ./tests/publication/health-check/health-check-workflow.test.sh
        ./tests/verify/distro-floor.test.sh
        ./tests/ci/policy/locale-pinned.test.sh
        ./tests/ci/policy/freshness-job-scope.test.sh
        ./tests/ci/policy/freshness-poll-concurrency.test.sh
        ./tests/ci/docs/documented-test-command.test.sh
        ./tests/ci/policy/gpgconf-kill-is-bounded.test.sh
        ./tests/ci/policy/publish-workflow-triggers.test.sh
        ./tests/quality/check-test-coverage.test.sh
        ./tests/quality/check-action-pins.test.sh
        ./tests/quality/check-commit-identity.test.sh
        ./tests/quality/check-secrets.test.sh
        ./tests/quality/ci-job-scope.test.sh
        ./tests/quality/ci-job-scope-suites.test.sh
        ./tests/quality/suite-scope-map.test.sh
        ./tests/ci/suites/ci-runs-every-test.test.sh
        ./tests/quality/check-suites-wired.test.sh
        ./tests/quality/lint-workflow-shell.test.sh
        ./tests/ci/reusable/reusable-line-limit.test.sh
        ./tests/ci/reusable/reusable-shell-ci.test.sh
        ./tests/ci/suites/shell-ci-scope.test.sh
        ./tests/ci/suites/lint-job-scope.test.sh
        ./tests/ci/policy/cancel-policy.test.sh
        ./tests/ci/reusable/reusable-empty-diff.test.sh
        ./tests/ci/reusable/reusable-dco.test.sh
        ./tests/quality/check-editorconfig.test.sh
        ./tests/monitoring/check-reusable-drift.test.sh
        ./tests/ci/policy/jobs-are-bounded.test.sh
        ./tests/ci/policy/workflow-shape.test.sh
        ./tests/ci/policy/freshness-pr-scope.test.sh
        ./tests/ci/policy/scheduled-workflows-are-watched.test.sh
        ./tests/ci/policy/network-calls-are-bounded.test.sh
        ./tests/ci/reusable/reusable-dependabot-freshness.test.sh
        ./tests/ci/reusable/reusable-schedule-freshness.test.sh
        ./tests/monitoring/check-suite-on-main.test.sh
        ./tests/monitoring/suite-on-main/check-suite-on-main-cron.test.sh
        ./tests/monitoring/suite-on-main/check-suite-on-main-push.test.sh
        ./tests/ci/reusable/reusable-workflow-lint.test.sh
        ./tests/monitoring/check-tool-versions.test.sh
        ./tests/quality/check-test-job-not-switchable.test.sh
        ./tests/quality/check-tooling-isolation.test.sh
      # shellcheck: tests/quality/lint-workflow-shell.test.sh plants a violation and
      # requires the linter to report it, so it needs the linter. The reusable
      # installs the release the shellcheck job pins, never the distribution's,
      # so the suite asks the linter the gate uses. On a pull request only the
      # packages of the suites it selects are installed, as
      # scripts/quality/suite-dependencies.txt lists them.
      # python3-yaml: the two workflow-lint scripts import it, and their suites,
      # tests/quality/check-test-job-not-switchable.test.sh and
      # tests/quality/check-tooling-isolation.test.sh, run them exactly as the
      # workflow-lint job does.
      apt-packages: python3-cryptography reprepro shellcheck python3-yaml

  # The ML-DSA-65 half of the release signature check, verified for real. It
  # needs cryptography 50.0.2 or later and the runner's python3-cryptography has
  # no ML-DSA, so this suite cannot run in the job above: the wheel is installed
  # into a virtual environment from scripts/verify/verify-debs-requirements.txt,
  # pinned by hash and binary only, and that environment comes first on PATH for
  # the suite and for the verify-debs.sh it runs. Without the wheel the suite
  # fails and says what is missing; it never skips.
  #
  # A job of its own rather than a second package list in the reusable: the
  # reusable installs from the distribution, and this is the one suite that needs
  # a library the distribution does not carry. It holds no secret.
  mldsa:
    name: ML-DSA-65 verifier
    # ubuntu-latest resolved to ubuntu-26.04 in apt's publish runs on
    # 2026-11-20. The image is named because this job's verdict depends on the
    # tools it ships, so a new image arrives as a commit and not overnight.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    # Bound: 6s measured locally for the venv, the three wheels and the suite.
    # Ten times that, rounded up, never under ten minutes; the six-hour default
    # is what a hang would otherwise cost.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Install the pinned cryptography wheel
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/mldsa-venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --quiet --disable-pip-version-check --require-hashes --only-binary=:all: -r scripts/verify/verify-debs-requirements.txt
          echo "$venv/bin" >> "$GITHUB_PATH"

      - name: Run the ML-DSA-65 verifier suite
        run: |
          set -euo pipefail
          ./tests/ci/suites/check-suite-completeness.test.sh ./tests/verify/verify-debs-mldsa.test.sh
