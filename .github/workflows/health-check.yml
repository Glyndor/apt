name: Health check

# Verifies that the published archive at apt.glyndor.net is reachable, fresh and
# internally consistent, and fails loudly if it is not. The publish workflow only
# notifies when a build runs and fails; this catches the cases it can't — the
# edge or R2 serving a stale, missing or mismatched index while no publish has
# errored. Failing safe (serving the last good state) is good, but it must never
# be silent.
#
# Reachable, fresh and consistent are three different properties and each step
# below asserts exactly one, so a failure names which one broke.
#
# Runs every six hours (offset from the publish cron) and on demand. The archive
# is treated as stale if the signed Release is older than 48h — twice the daily
# publish cadence, so one delayed or skipped cron never false-alarms, yet loud
# well before the 14-day Valid-Until would lock clients out.
#
# Schedule and on demand, no push or pull_request. This check asks whether the
# served archive at apt.glyndor.net is still healthy, not whether the code in
# this repository changed, so ordinary code events are not what triggers it.

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_URL: "https://apt.glyndor.net"
  MAX_AGE_HOURS: "48"

jobs:
  check:
    name: Check published archive
    runs-on: ubuntu-latest
    # Measured over the last six runs: 8 to 15 seconds. Every step here is a
    # fetch from the edge, and a fetch that never returns would otherwise sit
    # for six hours reporting nothing while the archive it watches goes stale.
    # Ten minutes covers the bounded retries with room to spare.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reachable and fresh InRelease
        run: |
          set -euo pipefail
          url="$BASE_URL/dists/stable/InRelease"
          tmp="$(mktemp)"
          if ! curl -fsS --retry 3 --retry-all-errors --retry-delay 5 --max-time 30 "$url" -o "$tmp"; then
            echo "::error::apt archive is unreachable at $url"
            exit 1
          fi
          # Verify the InRelease signature against the committed archive public key
          # before trusting anything in it. Without this, an attacker (or a poisoned
          # cache) could serve an unsigned body with a fresh Date and the freshness
          # check would pass — the same anchor apt clients trust must gate the alert.
          gpghome="$(mktemp -d)"
          verified="$(mktemp)"
          cleanup() { gpgconf --homedir "$gpghome" --kill all 2>/dev/null || true; rm -rf "$gpghome" "$tmp" "$verified"; }
          trap cleanup EXIT
          gpg --homedir "$gpghome" --batch --quiet --import keyring/glyndor-apt-key.asc
          if ! gpg --homedir "$gpghome" --batch --yes --output "$verified" --decrypt "$tmp" 2>/dev/null; then
            echo "::error::InRelease signature verification failed — the served index is unsigned or signed by an untrusted key"
            exit 1
          fi
          # The Date field is read from the cryptographically verified body. The
          # `|| true` keeps a no-match (grep exit 1) from dying under pipefail
          # before the emptiness guard below can run and print its own diagnostic.
          date_line="$(grep -m1 '^Date:' "$verified" | sed 's/^Date:[[:space:]]*//')" || true
          if [ -z "$date_line" ]; then
            echo "::error::no Date field in InRelease — the served index is malformed"
            exit 1
          fi
          # `date -d` on an unparseable value dies under `set -e` with no
          # ::error:: line, so the alert would name nothing and whoever opened
          # it would start from a bare exit code. A malformed Date is the same
          # class of breakage as a missing one and deserves the same sentence.
          if ! rel_epoch="$(date -u -d "$date_line" +%s 2>/dev/null)"; then
            echo "::error::the Date field in InRelease could not be read ('$date_line') — the served index is malformed"
            exit 1
          fi
          now_epoch="$(date -u +%s)"
          age_h=$(( (now_epoch - rel_epoch) / 3600 ))
          echo "InRelease Date: $date_line (${age_h}h old)"
          if [ "$age_h" -gt "$MAX_AGE_HOURS" ]; then
            echo "::error::apt archive is stale — InRelease is ${age_h}h old (> ${MAX_AGE_HOURS}h); the publish may have stopped"
            exit 1
          fi
          echo "archive reachable and fresh"

      - name: Served archive matches the signed index
        run: |
          set -euo pipefail
          # The same check publish.yml gates on, run on this workflow's cadence.
          # The gate proves the archive was consistent at the moment it was
          # published; without this, the up-to-24h until the next publish is
          # watched by nobody — the same shape of gap #47 was about. Sharing the
          # script rather than restating the logic is the point: if the two
          # diverged, this would pass what the gate would reject.
          #
          # Be clear about the ceiling. Between publishes nothing writes to the
          # archive, so what this adds over the freshness check above is catching
          # a partially-purged edge or degradation at rest — from whichever PoP
          # this runner happens to reach. A green run means "consistent from
          # where this looked", not "consistent everywhere"; the multi-region
          # version is the external-watcher class already declined.
          #
          # Three attempts, not the gate's six: no sync is in flight here, so a
          # mismatch should not be transient and an alert should not be held back.
          ./scripts/verify-published.sh "$BASE_URL" keyring/glyndor-apt-key.asc 3 10

      - name: Bootstrap keyring package reachable
        run: |
          set -euo pipefail
          # The freshness check above only proves the *established* client path
          # (an apt already trusting the archive key) works. A first-time install
          # instead starts from `curl ... glyndor-archive-keyring.deb`, a
          # different URL this check would otherwise never exercise — so a broken
          # bootstrap path could go unnoticed indefinitely.
          url="$BASE_URL/glyndor-archive-keyring.deb"
          if ! curl -fsSI --retry 3 --retry-all-errors --retry-delay 5 --max-time 30 "$url" >/dev/null; then
            echo "::error::bootstrap keyring unreachable"
            exit 1
          fi
          echo "bootstrap keyring reachable"
