name: Workflow lint (reusable)

# Lint the CALLING repository's own workflow YAML with actionlint: the release
# workflows and other per-repo callers that live outside this repository and
# are today validated by nobody. This is where the phantom-required-check
# naming mismatches and the PowerShell $VAR-under-pwsh trap have actually
# shipped, because nothing caught them before a consumer's CI ran for real.
# Contrast with actionlint.yml in this repository: that one is this repo's own
# self-CI over ITS reusables; this one runs actionlint over the CALLER's
# checkout, wherever the calling job invokes it from.
#
# actionlint's embedded shellcheck pass otherwise falls back to whatever
# shellcheck the runner image ships, which floats independently of the org's
# pinned version (shell-ci.yml). Installing the same pinned shellcheck here
# and pointing actionlint at it with -shellcheck keeps that pass reproducible
# too.

on:
  workflow_call:
    inputs:
      shellcheck-version:
        description: Exact shellcheck release tag to install from koalaman/shellcheck for actionlint's embedded shellcheck pass; bumped via .github releases
        type: string
        default: "v0.11.0"
      shellcheck-sha256:
        description: sha256 of that release's linux.x86_64 tarball; travels with shellcheck-version, so overriding one without the other fails the install
        type: string
        default: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
      tooling-isolation:
        description: Fail when a job that holds a secret also installs third-party tooling
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    # Bound: 15 to 28s measured, and it installs actionlint and shellcheck.
    # Ten times that, rounded up, never under ten minutes; the six-hour
    # default is what a hang would otherwise cost.
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: v1.7.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `stable` rather than a number, and this is the one pin in this file that
      # is deliberately absent.
      #
      # This Go compiles nothing of ours. It exists to build actionlint, and
      # what has to be reproducible there is the tool, which is pinned by
      # ACTIONLINT_VERSION and keyed into the cache by it. The compiler that
      # assembles it is not part of that claim.
      #
      # A number here has no update path. Dependabot's github-actions ecosystem
      # does not touch a tool version written inside a workflow, so it moves
      # only when somebody remembers, and nothing turns red when it stops being
      # supported: Go keeps the last two releases, so a frozen number silently
      # becomes an unsupported compiler while the job stays green. It sat at
      # 1.26 with 1.27 out, which is how this was noticed.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: actionlint-cache
        with:
          path: ~/go/bin/actionlint
          key: actionlint-${{ runner.os }}-${{ env.ACTIONLINT_VERSION }}

      - name: Install actionlint
        if: steps.actionlint-cache.outputs.cache-hit != 'true'
        run: go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"

      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: ${{ inputs.shellcheck-version }}
          SHELLCHECK_SHA256: ${{ inputs.shellcheck-sha256 }}
        run: |
          set -euo pipefail
          # Same verified-download idiom as shell-ci.yml: pinned by tag rather
          # than whatever the runner image preinstalls, and checked against the
          # release's sha256 before extraction, since a plain HTTPS fetch has no
          # registry behind it vouching for what came back.
          dir="$RUNNER_TEMP/shellcheck-bin"
          tarball="$RUNNER_TEMP/shellcheck.tar.xz"
          mkdir -p "$dir"
          curl -sSfL -o "$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$tarball" | sha256sum -c -
          tar -xJ -f "$tarball" -C "$dir" --strip-components=1 "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          chmod +x "$dir/shellcheck"
          echo "SHELLCHECK_BIN=$dir/shellcheck" >> "$GITHUB_ENV"

      - name: Run actionlint over the caller's workflows
        env:
          SHELLCHECK_BIN: ${{ env.SHELLCHECK_BIN }}
        run: actionlint -color "-shellcheck=${SHELLCHECK_BIN}"

      # A job that installs third-party tooling is running code we did not
      # write: `cargo install` (and the other installers) executes build
      # scripts over the whole dependency tree, so the secrets a job holds
      # are reachable from code outside this organisation. Keeping the
      # install out of any job that holds a secret bounds that reach to
      # nothing. `pip install --require-hashes` is the exception because a
      # hash-pinned install resolves nothing, since the artifacts are fixed by
      # the lockfile, so no surprise tree appears.
      # A required test job must not be switchable off.
      #
      # The previous form of this check was a text match over the test-command
      # block. Two edits walked straight past it. Job-level `if: false` on the
      # caller leaves the test-command string untouched, so the grep saw
      # nothing wrong; GitHub reports a skipped required check as Success and
      # does not block a merge, so the suite went dark while CI stayed green.
      # And `true || ./tests/first.test.sh && ./tests/second.test.sh` still
      # contains the pattern the grep looked for; bash short-circuits the
      # prefix, so the suite never runs.
      #
      # This step now parses the workflow instead. It refuses, each with its
      # own message naming the file, the job and the reason:
      #
      #   - a caller of reusable-shell-ci.yml that carries a job-level `if:`
      #     of any value. Any conditional on a caller of a required job is a
      #     switch; a skipped required check reports Success.
      #   - a test-command whose first non-blank token is not a suite
      #     invocation. The accepted grammar is a list of
      #     `./tests/<name>.test.sh` or `bash ./tests/<name>.test.sh`
      #     invocations joined by `&&`, optionally spread over lines with
      #     YAML block scalars.
      #   - the suppression forms: `|| true` anywhere in the command, a
      #     `true ||` prefix, and a leading `exit 0`. All three make the
      #     suite go dark without failing the required check.
      #   - no caller at all, which the previous message already named.
      #
      # The grammar is repeated in every refusal except the no-caller one, so
      # an author who trips the check learns the shape rather than guessing
      # from "your command is wrong".
      #
      # This assertion cannot live in the shell job: that is the job the
      # `if:` skips, so a check inside it shares the fate of the thing it
      # would be checking. workflow-lint is a separate required check and
      # survives.
      # Requiring at least one caller is half the check, and the half the
      # previous form left out first. Iterating callers and finding none
      # passes: "no violations found" and "nothing to look at" produce the
      # same green, which is the exact failure this assertion was written
      # against. Deleting tests.yml outright would have walked straight past
      # it.
      - name: A required test job must not be switchable off
        run: |
          python3 - <<'PY'
          import glob
          import os
          import re
          import sys

          import yaml

          # The reusable that defines the required `shell / test` check.
          REUSABLE = "reusable-shell-ci.yml"

          # A single suite invocation, as the grammar accepts it: the path
          # alone, or `bash` in front of it. Names are constrained to what
          # the shell treats as ordinary characters, so `./tests/a-b_c.test.sh`
          # and `./tests/a-b_c/inner.test.sh` are accepted but `./tests/*`
          # is not; the grammar is strict by design.
          INVOCATION_RE = re.compile(
              r"^(?:bash )?\./tests/[A-Za-z0-9_./-]+\.test\.sh$"
          )

          # The three suppression forms. Each is matched against the command
          # with whitespace normalised: newlines folded to single spaces,
          # runs of whitespace collapsed.
          OR_TRUE_RE = re.compile(r"\|\|\s*true")
          TRUE_OR_PREFIX_RE = re.compile(r"^\s*true\s*\|\|")
          EXIT_0_PREFIX_RE = re.compile(r"^\s*exit\s+0\b")

          # Repeated in every grammar refusal, so an author
          # who trips the check learns the shape rather than guessing.
          GRAMMAR = (
              "The accepted grammar is a list of `./tests/<name>.test.sh` or "
              "`bash ./tests/<name>.test.sh` invocations joined by `&&`, "
              "optionally spread over lines with YAML block scalars"
          )


          def normalize(value):
              # Block scalars fold newlines to spaces; collapse whitespace
              # so `&&` is the only separator left to look for.
              return " ".join(value.split())


          def check_test_command(cmd, path, job_id):
              """Return None on success, else a refusal message that already
              names the file and the job."""
              if OR_TRUE_RE.search(cmd):
                  return (
                      f"job `{job_id}` in {path} has `|| true` in its "
                      "test-command. That masks a suite failure: bash "
                      "short-circuits the suite, and the required check "
                      "reports Success regardless. " + GRAMMAR + "."
                  )
              if TRUE_OR_PREFIX_RE.match(cmd):
                  return (
                      f"job `{job_id}` in {path} has a test-command that "
                      "starts with `true ||`. Bash short-circuits the prefix "
                      "and skips every suite. " + GRAMMAR + "."
                  )
              if EXIT_0_PREFIX_RE.match(cmd):
                  return (
                      f"job `{job_id}` in {path} has a test-command that "
                      "starts with `exit 0`. The shell exits before any "
                      "suite runs. " + GRAMMAR + "."
                  )
              # Grammar: split on `&&`, strip, and every part must be a suite
              # invocation. An empty part (a stray `&&`) is also a violation
              # and falls into the empty-part branch below.
              parts = [p.strip() for p in cmd.split("&&")]
              if not parts or not parts[0]:
                  return (
                      f"job `{job_id}` in {path} has a test-command that "
                      "names no suite. " + GRAMMAR + "."
                  )
              if not INVOCATION_RE.match(parts[0]):
                  return (
                      f"job `{job_id}` in {path} has a test-command whose "
                      "first non-blank token is not a suite invocation. "
                      + GRAMMAR + "."
                  )
              for part in parts[1:]:
                  if not INVOCATION_RE.match(part):
                      return (
                          f"job `{job_id}` in {path} has a test-command whose "
                          "later invocations do not match the grammar. "
                          + GRAMMAR + "."
                      )
              return None


          def main():
              files = sorted(set(
                  glob.glob(".github/workflows/*.yml")
                  + glob.glob(".github/workflows/*.yaml")
              ))

              callers = 0
              violations = []

              for path in files:
                  name = os.path.basename(path)
                  if name.startswith("reusable-"):
                      continue
                  try:
                      with open(path) as fh:
                          spec = yaml.safe_load(fh)
                  except yaml.YAMLError as e:
                      # Silent skip would hide a misconfigured workflow that
                      # the caller is going to learn about elsewhere in CI
                      # for the wrong reason. Warning annotation instead.
                      print(f"::warning file={path}::skipped: YAML parse error: {e}")
                      continue
                  if not isinstance(spec, dict):
                      continue
                  jobs = spec.get("jobs") or {}
                  if not isinstance(jobs, dict):
                      continue
                  for job_id, job in jobs.items():
                      if not isinstance(job, dict):
                          continue
                      uses = job.get("uses")
                      if not isinstance(uses, str) or REUSABLE not in uses:
                          continue
                      callers += 1
                      # Rule: a job-level `if:` on a caller of a required job
                      # is a switch. Any value: `false`, `inputs.foo`, even
                      # `true` would skip the call when the expression is
                      # false, and a skipped required check reports Success.
                      if "if" in job:
                          violations.append((
                              path, job_id,
                              f"job `{job_id}` in {path} calls `{REUSABLE}` "
                              "and carries a job-level `if:` of any value. "
                              "Any conditional on a caller of a required job "
                              "is a switch: a skipped required check reports "
                              "Success and does not block a merge. Move the "
                              "condition into the called workflow's steps, or "
                              "delete it."
                          ))
                          continue
                      # Rule: the test-command must invoke at least one suite.
                      with_block = job.get("with")
                      tc = (
                          with_block.get("test-command")
                          if isinstance(with_block, dict) else None
                      )
                      if not isinstance(tc, str) or not tc.strip():
                          violations.append((
                              path, job_id,
                              f"job `{job_id}` in {path} calls `{REUSABLE}` "
                              "without a test-command that runs any suite. "
                              + GRAMMAR + "."
                          ))
                          continue
                      err = check_test_command(normalize(tc), path, job_id)
                      if err is not None:
                          violations.append((path, job_id, err))

              if callers == 0:
                  print(
                      "::error::no workflow calls reusable-shell-ci, so the "
                      "required `shell / test` check would never report"
                  )
                  print(
                      "A required check that is never reported blocks a pull "
                      "request, but nothing here would have said why."
                  )
                  sys.exit(1)
              if violations:
                  for path, job_id, msg in violations:
                      print(f"::error file={path}::{msg}")
                  sys.exit(1)
              print(
                  "every reusable-shell-ci caller passes a test-command that "
                  "runs a suite"
              )


          if __name__ == "__main__":
              main()
          PY

      - name: A job holding a secret must not install third-party tooling
        if: ${{ inputs.tooling-isolation }}
        run: |
          python3 - <<'PY'
          import glob
          import re
          import sys

          import yaml

          # `secrets.<id>` is how every GitHub Actions expression reaches a
          # secret. `secrets: inherit` and `secrets:` declarations on
          # reusable calls don't match, because those are declaration blocks, not
          # references, and `secrets:` does not contain a `.`.
          SECRET_RE = re.compile(r"(?<!\w)secrets\.[A-Za-z_]\w*")

          # (`pattern`, `opt-out marker on the same line`). The marker, when
          # present on the line, exempts that install: the only case where
          # the resolved tree is fixed is pip with --require-hashes, which
          # reads the lockfile verbatim and installs exactly what it lists.
          INSTALL_PATTERNS = (
              ("cargo install",   None),
              ("go install",      None),
              ("gem install",     None),
              ("npm install -g",  None),
              ("npm i -g",        None),
              ("pip install",     "--require-hashes"),
          )


          def normalize_run(value):
              # `run:` is either a single string or a list of strings. Split
              # each into lines so the install scan is per-line: a
              # `--require-hashes` marker on one line only exempts that line.
              if isinstance(value, list):
                  out = []
                  for v in value:
                      if isinstance(v, str):
                          out.extend(v.splitlines())
                  return out
              if isinstance(value, str):
                  return value.splitlines()
              return []


          def find_violations(spec_path):
              violations = []
              try:
                  with open(spec_path) as fh:
                      spec = yaml.safe_load(fh)
              except yaml.YAMLError as e:
                  # Silent skip would hide a misconfigured workflow that the
                  # caller is going to learn about elsewhere in CI for the
                  # wrong reason. Warning annotation instead.
                  print(f"::warning file={spec_path}::skipped: YAML parse error: {e}")
                  return violations
              if not isinstance(spec, dict):
                  return violations
              jobs = spec.get("jobs") or {}
              for job_id, job in jobs.items():
                  if not isinstance(job, dict):
                      continue
                  # Re-serialize the job so `with:`, `env:`, `if:` and
                  # `run:` strings are all scanned for a secret reference.
                  # Comments are stripped by safe_load, so they cannot
                  # produce a false positive.
                  job_text = yaml.safe_dump(job)
                  if not SECRET_RE.search(job_text):
                      continue
                  for step in (job.get("steps") or []):
                      if not isinstance(step, dict):
                          continue
                      run = step.get("run")
                      if run is None:
                          continue
                      for line in normalize_run(run):
                          stripped = line.lstrip()
                          if not stripped or stripped.startswith("#"):
                              continue
                          for pattern, except_marker in INSTALL_PATTERNS:
                              if pattern in line and not (
                                  except_marker and except_marker in line
                              ):
                                  violations.append((spec_path, job_id, line))
                                  break
              return violations


          def main():
              files = sorted(set(
                  glob.glob(".github/workflows/*.yml")
                  + glob.glob(".github/workflows/*.yaml")
              ))
              violations = []
              for path in files:
                  violations.extend(find_violations(path))
              if violations:
                  for path, job_id, line in violations:
                      msg = (
                          f"job `{job_id}` installs third-party tooling while holding a secret: "
                          f"`{line.strip()}`. See Glyndor/apt#121. Fix by moving the install "
                          f"into a job that holds no secrets, or pin it by hash "
                          f"(e.g. `pip install --require-hashes`)."
                      )
                      print(f"::error file={path}::{msg}")
                  sys.exit(1)
              print(
                  "tooling-isolation: no job holding a secret installs third-party tooling."
              )
              sys.exit(0)


          if __name__ == "__main__":
              sys.exit(main())
          PY
