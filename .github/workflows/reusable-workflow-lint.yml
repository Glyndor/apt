name: Workflow lint (reusable)

# Lint the CALLING repository's own workflow YAML with actionlint: the release
# workflows and other per-repo callers that live outside this repository and
# are today validated by nobody. This is where the phantom-required-check
# naming mismatches and the PowerShell $VAR-under-pwsh trap have actually
# shipped, because nothing caught them before a consumer's CI ran for real.
# Contrast with actionlint.yml in this repository: that one is this repo's own
# self-CI over ITS reusables; this one runs actionlint over the CALLER's
# checkout, wherever the calling job invokes it from.
#
# actionlint's embedded shellcheck pass otherwise falls back to whatever
# shellcheck the runner image ships, which floats independently of the org's
# pinned version (shell-ci.yml). Installing the same pinned shellcheck here
# and pointing actionlint at it with -shellcheck keeps that pass reproducible
# too.

on:
  workflow_call:
    inputs:
      shellcheck-version:
        description: Exact shellcheck release tag to install from koalaman/shellcheck for actionlint's embedded shellcheck pass; bumped here and in the sibling channels together
        type: string
        default: "v0.11.0"
      shellcheck-sha256:
        description: sha256 of that release's linux.x86_64 tarball; travels with shellcheck-version, so overriding one without the other fails the install
        type: string
        default: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
      tooling-isolation:
        description: Fail when a job that holds a secret also installs third-party tooling
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.workflow }}-${{ github.ref }}
  # Only a pull request supersedes its own earlier run. A push to main is a
  # distinct commit that has to be judged on its own, and the suite-on-main
  # watcher reads those verdicts; a cron run is never replaced by the next.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    # Bound: 15 to 28s measured, and it installs actionlint and shellcheck.
    # Ten times that, rounded up, never under ten minutes; the six-hour
    # default is what a hang would otherwise cost.
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: v1.7.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      # Keep the required check present. Read the classifier from the PR base,
      # so a changed helper cannot skip its own validation. First adoption (no
      # base helper), unknown output or a failed diff means a full run.
      - name: Decide whether workflow-lint is needed
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          SCOPE_JOB: workflow-lint
        run: |
          set -euo pipefail
          needed=true
          script="$(mktemp "$RUNNER_TEMP/lint-scope.XXXXXX")"
          trap 'rm -f "$script"' EXIT
          if [ "$EVENT" = pull_request ] \
            && git show HEAD^1:scripts/quality/ci-job-scope.sh > "$script" 2>/dev/null; then
            if decision="$(bash "$script" "$SCOPE_JOB")" \
              && [[ "$decision" == true || "$decision" == false ]]; then
              needed="$decision"
            fi
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          if [ "$needed" = false ]; then
            echo "No changed inputs for $SCOPE_JOB; expensive steps skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Running $SCOPE_JOB (changed inputs or scope not established)."
          fi

      - if: steps.scope.outputs.needed != 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: actionlint-cache
        with:
          path: ~/go/bin/actionlint
          key: actionlint-${{ runner.os }}-${{ env.ACTIONLINT_VERSION }}

      # `stable` rather than a number, and this is the one pin in this file that
      # is deliberately absent.
      #
      # This Go compiles nothing of ours. It exists to build actionlint, and
      # what has to be reproducible there is the tool, which is pinned by
      # ACTIONLINT_VERSION and keyed into the cache by it. The compiler that
      # assembles it is not part of that claim.
      #
      # A number here has no update path. Dependabot's github-actions ecosystem
      # does not touch a tool version written inside a workflow, so it moves
      # only when somebody remembers, and nothing turns red when it stops being
      # supported: Go keeps the last two releases, so a frozen number silently
      # becomes an unsupported compiler while the job stays green. It sat at
      # 1.26 with 1.27 out, which is how this was noticed.
      - if: steps.scope.outputs.needed != 'false' && steps.actionlint-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Install actionlint
        if: steps.scope.outputs.needed != 'false' && steps.actionlint-cache.outputs.cache-hit != 'true'
        run: go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"

      # A cache hit skips setup-go, which is what used to put the Go bin
      # directory on PATH, so say where the restored binary is.
      - name: Put actionlint on PATH
        if: steps.scope.outputs.needed != 'false'
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Install shellcheck
        if: steps.scope.outputs.needed != 'false'
        env:
          SHELLCHECK_VERSION: ${{ inputs.shellcheck-version }}
          SHELLCHECK_SHA256: ${{ inputs.shellcheck-sha256 }}
        run: |
          set -euo pipefail
          # Same verified-download idiom as shell-ci.yml: pinned by tag rather
          # than whatever the runner image preinstalls, and checked against the
          # release's sha256 before extraction, since a plain HTTPS fetch has no
          # registry behind it vouching for what came back.
          dir="$RUNNER_TEMP/shellcheck-bin"
          tarball="$RUNNER_TEMP/shellcheck.tar.xz"
          mkdir -p "$dir"
          curl -sSfL -o "$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$tarball" | sha256sum -c -
          tar -xJ -f "$tarball" -C "$dir" --strip-components=1 "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          chmod +x "$dir/shellcheck"
          echo "SHELLCHECK_BIN=$dir/shellcheck" >> "$GITHUB_ENV"

      - name: Run actionlint over the caller's workflows
        if: steps.scope.outputs.needed != 'false'
        env:
          SHELLCHECK_BIN: ${{ env.SHELLCHECK_BIN }}
        run: actionlint -color "-shellcheck=${SHELLCHECK_BIN}"

      # A job that installs third-party tooling is running code we did not
      # write: `cargo install` (and the other installers) executes build
      # scripts over the whole dependency tree, so the secrets a job holds
      # are reachable from code outside this organisation. Keeping the
      # install out of any job that holds a secret bounds that reach to
      # nothing. `pip install --require-hashes` is the exception because a
      # hash-pinned install resolves nothing, since the artifacts are fixed by
      # the lockfile, so no surprise tree appears.
      #
      # `apt-get install` and `brew install` are the same shape and are judged
      # by the same rule, with the exemptions the standard grants:
      #
      #   - An apt install from the distribution's own archive is exempt. The
      #     mechanism is identical -- dpkg runs maintainer scripts as root in
      #     the same workspace -- and the difference is who can put a package
      #     there: that archive is signed, its uploads are gated on a
      #     maintainer, and the runner image already trusts it. A third-party
      #     apt source added in the job is not covered, and neither is an
      #     install that the archive's own metadata cannot resolve.
      #   - That exemption covers the exposure the standard accepts, which is
      #     persistence: an install in a job whose secret arrives in a later
      #     step cannot read that secret, because secrets are injected per
      #     step. An install step whose own environment carries the secret is
      #     the other exposure -- the maintainer scripts run with the secret
      #     in reach -- and it is not covered.
      #   - `brew style` and `brew audit` install nothing by themselves; what
      #     turns them into an install is Homebrew's auto-update, which
      #     fetches formulae and installs their bottles before the command
      #     runs. HOMEBREW_NO_AUTO_UPDATE is what stops it.
      #
      # There is no hash exception for apt, and that is decided rather than
      # forgotten: apt has no `--require-hashes`, and a version pin fixes the
      # version and not the bytes. What verifies an apt package is the
      # archive's signature, so the exemption is decided by where the package
      # comes from.
      # A required test job must not be switchable off.
      #
      # The previous form of this check was a text match over the test-command
      # block. Two edits walked straight past it. Job-level `if: false` on the
      # caller leaves the test-command string untouched, so the grep saw
      # nothing wrong; GitHub reports a skipped required check as Success and
      # does not block a merge, so the suite went dark while CI stayed green.
      # And `true || ./tests/first.test.sh && ./tests/second.test.sh` still
      # contains the pattern the grep looked for; bash short-circuits the
      # prefix, so the suite never runs.
      #
      # This step now parses the workflow instead. It refuses, each with its
      # own message naming the file, the job and the reason:
      #
      #   - a caller of reusable-shell-ci.yml that carries a job-level `if:`
      #     of any value. Any conditional on a caller of a required job is a
      #     switch; a skipped required check reports Success.
      #   - a test-command whose first non-blank token is not a suite
      #     invocation. The accepted grammar is a list of
      #     `./tests/<name>.test.sh` or `bash ./tests/<name>.test.sh`
      #     invocations joined by `&&`, optionally spread over lines with
      #     YAML block scalars.
      #   - the suppression forms: `|| true` anywhere in the command, a
      #     `true ||` prefix, and a leading `exit 0`. All three make the
      #     suite go dark without failing the required check.
      #   - no caller at all, which the previous message already named.
      #
      # The grammar is repeated in every refusal except the no-caller one, so
      # an author who trips the check learns the shape rather than guessing
      # from "your command is wrong".
      #
      # This assertion cannot live in the shell job: that is the job the
      # `if:` skips, so a check inside it shares the fate of the thing it
      # would be checking. workflow-lint is a separate required check and
      # survives.
      # Requiring at least one caller is half the check, and the half the
      # previous form left out first. Iterating callers and finding none
      # passes: "no violations found" and "nothing to look at" produce the
      # same green, which is the exact failure this assertion was written
      # against. Deleting tests.yml outright would have walked straight past
      # it.
      - name: A required test job must not be switchable off
        if: steps.scope.outputs.needed != 'false'
        run: |
          python3 - <<'PY'
          import glob
          import os
          import re
          import sys

          import yaml

          # The reusable that defines the required `shell / test` check.
          REUSABLE = "reusable-shell-ci.yml"

          # A single suite invocation, as the grammar accepts it: the path
          # alone, or `bash` in front of it. Names are constrained to what
          # the shell treats as ordinary characters, so `./tests/a-b_c.test.sh`
          # and `./tests/a-b_c/inner.test.sh` are accepted but `./tests/*`
          # is not; the grammar is strict by design.
          INVOCATION_RE = re.compile(
              r"^(?:bash )?\./tests/[A-Za-z0-9_./-]+\.test\.sh$"
          )

          # The three suppression forms. Each is matched against the command
          # with whitespace normalised: newlines folded to single spaces,
          # runs of whitespace collapsed.
          OR_TRUE_RE = re.compile(r"\|\|\s*true")
          TRUE_OR_PREFIX_RE = re.compile(r"^\s*true\s*\|\|")
          EXIT_0_PREFIX_RE = re.compile(r"^\s*exit\s+0\b")

          # Repeated in every grammar refusal, so an author
          # who trips the check learns the shape rather than guessing.
          # The runner form: one script that takes the suites as arguments,
          # runs each and requires the sentinel every suite prints as its last
          # line. It exists because a `&&` chain cannot tell a suite that ran
          # every assertion from one that exited early having run a few, and
          # both look like success. A caller using it names the runner first
          # and the suites after it, whitespace separated.
          RUNNER_RE = re.compile(r"^(?:bash )?\./tests/ci/suites/check-suite-completeness\.test\.sh$")

          GRAMMAR = (
              "The accepted grammar is either a list of `./tests/<name>.test.sh` "
              "or `bash ./tests/<name>.test.sh` invocations joined by `&&`, or "
              "`./tests/ci/suites/check-suite-completeness.test.sh` followed by one or "
              "more such invocations as its arguments; either form may be "
              "spread over lines with YAML block scalars"
          )


          def normalize(value):
              # Block scalars fold newlines to spaces; collapse whitespace
              # so `&&` is the only separator left to look for.
              return " ".join(value.split())


          def check_test_command(cmd, path, job_id):
              """Return None on success, else a refusal message that already
              names the file and the job."""
              if OR_TRUE_RE.search(cmd):
                  return (
                      f"job `{job_id}` in {path} has `|| true` in its "
                      "test-command. That masks a suite failure: bash "
                      "short-circuits the suite, and the required check "
                      "reports Success regardless. " + GRAMMAR + "."
                  )
              if TRUE_OR_PREFIX_RE.match(cmd):
                  return (
                      f"job `{job_id}` in {path} has a test-command that "
                      "starts with `true ||`. Bash short-circuits the prefix "
                      "and skips every suite. " + GRAMMAR + "."
                  )
              if EXIT_0_PREFIX_RE.match(cmd):
                  return (
                      f"job `{job_id}` in {path} has a test-command that "
                      "starts with `exit 0`. The shell exits before any "
                      "suite runs. " + GRAMMAR + "."
                  )
              # Two shapes, and which one this is decided by the first token.
              # The runner takes its suites as arguments, so the command is
              # whitespace separated and every argument after the runner has to
              # be a suite. Anything else is the `&&` chain: split on `&&`,
              # strip, and every part must be a suite invocation. An empty part
              # (a stray `&&`) is also a violation and falls into the
              # empty-part branch below.
              tokens = cmd.split()
              if tokens and RUNNER_RE.match(tokens[0]):
                  if len(tokens) == 1:
                      return (
                          f"job `{job_id}` in {path} runs the suite runner with "
                          "no suites to run, so the required check would report "
                          "Success having tested nothing. " + GRAMMAR + "."
                      )
                  for arg in tokens[1:]:
                      if not INVOCATION_RE.match(arg):
                          return (
                              f"job `{job_id}` in {path} passes `{arg}` to the "
                              "suite runner, which is not a suite invocation. "
                              + GRAMMAR + "."
                          )
                  return None
              parts = [p.strip() for p in cmd.split("&&")]
              if not parts or not parts[0]:
                  return (
                      f"job `{job_id}` in {path} has a test-command that "
                      "names no suite. " + GRAMMAR + "."
                  )
              if not INVOCATION_RE.match(parts[0]):
                  return (
                      f"job `{job_id}` in {path} has a test-command whose "
                      "first non-blank token is not a suite invocation. "
                      + GRAMMAR + "."
                  )
              for part in parts[1:]:
                  if not INVOCATION_RE.match(part):
                      return (
                          f"job `{job_id}` in {path} has a test-command whose "
                          "later invocations do not match the grammar. "
                          + GRAMMAR + "."
                      )
              return None


          def main():
              files = sorted(set(
                  glob.glob(".github/workflows/*.yml")
                  + glob.glob(".github/workflows/*.yaml")
              ))

              callers = 0
              violations = []

              for path in files:
                  name = os.path.basename(path)
                  if name.startswith("reusable-"):
                      continue
                  try:
                      with open(path) as fh:
                          spec = yaml.safe_load(fh)
                  except yaml.YAMLError as e:
                      # Silent skip would hide a misconfigured workflow that
                      # the caller is going to learn about elsewhere in CI
                      # for the wrong reason. Warning annotation instead.
                      print(f"::warning file={path}::skipped: YAML parse error: {e}")
                      continue
                  if not isinstance(spec, dict):
                      continue
                  jobs = spec.get("jobs") or {}
                  if not isinstance(jobs, dict):
                      continue
                  for job_id, job in jobs.items():
                      if not isinstance(job, dict):
                          continue
                      uses = job.get("uses")
                      if not isinstance(uses, str) or REUSABLE not in uses:
                          continue
                      callers += 1
                      # Rule: a job-level `if:` on a caller of a required job
                      # is a switch. Any value: `false`, `inputs.foo`, even
                      # `true` would skip the call when the expression is
                      # false, and a skipped required check reports Success.
                      if "if" in job:
                          violations.append((
                              path, job_id,
                              f"job `{job_id}` in {path} calls `{REUSABLE}` "
                              "and carries a job-level `if:` of any value. "
                              "Any conditional on a caller of a required job "
                              "is a switch: a skipped required check reports "
                              "Success and does not block a merge. Move the "
                              "condition into the called workflow's steps, or "
                              "delete it."
                          ))
                          continue
                      # Rule: the test-command must invoke at least one suite.
                      with_block = job.get("with")
                      tc = (
                          with_block.get("test-command")
                          if isinstance(with_block, dict) else None
                      )
                      if not isinstance(tc, str) or not tc.strip():
                          violations.append((
                              path, job_id,
                              f"job `{job_id}` in {path} calls `{REUSABLE}` "
                              "without a test-command that runs any suite. "
                              + GRAMMAR + "."
                          ))
                          continue
                      # A literal block scalar (`|`) keeps newlines, so each
                      # line of the YAML value becomes its own shell
                      # statement. `bash -c "$TEST_COMMAND"` then returns the
                      # LAST statement's exit code, and an early failing
                      # suite would not fail the required check. This is
                      # checked against the RAW value, before `normalize()`
                      # folds newlines to spaces.
                      if "\n" in tc:
                          violations.append((
                              path, job_id,
                              f"job `{job_id}` in {path} has a literal "
                              "block scalar (`|`) in its test-command, "
                              "which splits the command into separate "
                              "shell statements whose failures the job "
                              "would not see. The folded form (`>-`) or "
                              "`&&` is the accepted shape. " + GRAMMAR + "."
                          ))
                          continue
                      err = check_test_command(normalize(tc), path, job_id)
                      if err is not None:
                          violations.append((path, job_id, err))

              if callers == 0:
                  print(
                      "::error::no workflow calls reusable-shell-ci, so the "
                      "required `shell / test` check would never report"
                  )
                  print(
                      "A required check that is never reported blocks a pull "
                      "request, but nothing here would have said why."
                  )
                  sys.exit(1)
              if violations:
                  for path, job_id, msg in violations:
                      print(f"::error file={path}::{msg}")
                  sys.exit(1)
              print(
                  "every reusable-shell-ci caller passes a test-command that "
                  "runs a suite"
              )


          if __name__ == "__main__":
              main()
          PY

      - name: A job holding a secret must not install third-party tooling
        if: ${{ inputs.tooling-isolation && steps.scope.outputs.needed != 'false' }}
        run: |
          python3 - <<'PY'
          import glob
          import re
          import sys

          import yaml

          # `secrets.<id>` is how every GitHub Actions expression reaches a
          # secret. `secrets: inherit` and `secrets:` declarations on
          # reusable calls don't match, because those are declaration blocks, not
          # references, and `secrets:` does not contain a `.`.
          SECRET_RE = re.compile(r"(?<!\w)secrets\.[A-Za-z_]\w*")

          # (`pattern`, `opt-out marker on the same line`). The marker, when
          # present on the line, exempts that install: the only case where
          # the resolved tree is fixed is pip with --require-hashes, which
          # reads the lockfile verbatim and installs exactly what it lists.
          INSTALL_PATTERNS = (
              ("cargo install",   None),
              ("go install",      None),
              ("gem install",     None),
              ("npm install -g",  None),
              ("npm i -g",        None),
              ("pip install",     "--require-hashes"),
          )

          # `apt-get install` and `apt install`, and the two edges of the
          # exemption the standard grants them.
          #
          # The standard exempts an apt install from the distribution's own
          # repositories, and the reason is the trust anchor rather than the
          # mechanism: dpkg runs maintainer scripts as root either way, so a
          # hostile package can persist the way a build.rs can. What differs
          # is who can put a package there. A distribution's archive is signed,
          # its uploads are gated on a maintainer, and the runner image already
          # trusts it; a third-party source added in the job is publish-on-
          # demand with extra steps, and the standard says so in as many
          # words. Its other edge is that the package has to come from that
          # archive: an install the archive's own metadata cannot resolve
          # carries no archive signature.
          #
          # The second edge is this repository's own, and it is where the
          # standard's own account of the exposure decides it. Secrets are
          # injected per step, so an install in a job whose secret arrives in
          # a LATER step cannot read that secret; what it can do is persist,
          # and the standard accepts that residual for the distribution's
          # archive. An install step whose own environment carries the secret
          # is a different exposure -- the package's maintainer scripts run
          # as root with the secret in reach -- and the residual the standard
          # accepted does not cover it.
          APT_INSTALL_RE = re.compile(r"\bapt(?:-get)?\s+install\b")

          # The arguments of an apt install, up to the first shell operator.
          APT_INSTALL_ARGS_RE = re.compile(r"\bapt(?:-get)?\s+install\s+(.*)$")

          # A package the archive's own metadata can resolve: a name, with an
          # optional architecture qualifier and an optional exact version.
          # Anything else -- a URI, a local file, a shell expansion -- is not
          # resolved by the archive.
          APT_PACKAGE_RE = re.compile(
              r"^[a-z0-9][a-z0-9+.-]*(?::[a-z0-9-]+)?(?:=[^ ]+)?$"
          )

          # What adds an apt source that is not the distribution's own: a
          # source list written, a key dropped into the trusted directory, a
          # preferences file, a key added with apt-key, or a sources.list
          # entry wherever it is written.
          APT_SOURCE_RE = re.compile(
              r"\badd-apt-repository\b"
              r"|/etc/apt/sources\.list"
              r"|/etc/apt/trusted\.gpg\.d"
              r"|/etc/apt/preferences\.d"
              r"|\bapt-key\s+(add|adv)\b"
              r"|^\s*deb(?:-src)?\s+(?:\[[^\]]*\]\s*)?\S+/\S+\s+\S+"
          )

          # The flags that switch the archive's signature check off. With one
          # of them the package is not verified by the trust anchor the
          # exemption rests on.
          APT_INSECURE_RE = re.compile(
              r"--allow-unauthenticated|--allow-insecure-repositories"
              r"|AllowInsecure|AllowUnauthenticated"
          )

          # `brew install` resolves a formula and installs it, and `brew
          # upgrade` installs the bottles of the formulae it resolves. Homebrew
          # is not the distribution the runner image already trusts -- it is
          # installed into the job on demand -- and a formula can come from any
          # tap, where publication is on demand. The bottle's digest comes
          # from the tap rather than from this repository, so it is not the
          # analogue of `pip install --require-hashes`, and no exemption is
          # granted to it.
          BREW_INSTALL_RE = re.compile(r"\bbrew\s+(install|upgrade)\b")

          # `brew style` and `brew audit` run the toolchain Homebrew already
          # carries and install nothing by themselves. What turns them into an
          # install is Homebrew's auto-update, which fetches formulae and
          # installs their bottles before the command runs. The variable that
          # stops it is the one the CI standard requires of every job that
          # invokes a tool with auto-update behaviour, so a job that sets it
          # for the step that runs the command is exempt. An empty value
          # disables it, which is what the tap's own policy test means by it.
          BREW_TOOL_RE = re.compile(r"\bbrew\s+(style|audit)\b")
          NO_AUTO_UPDATE = "HOMEBREW_NO_AUTO_UPDATE"


          # An action runs with the job's secrets in reach, so one from an
          # owner outside this list is third-party code in a secret-holding
          # job, the same exposure as `go install` above. Local reusables
          # (`./`) are this repository's own and are skipped by the caller.
          FIRST_PARTY_OWNERS = {"actions", "github"}


          def normalize_run(value):
              # `run:` is either a single string or a list of strings. Split
              # each into lines so the install scan is per-line: a
              # `--require-hashes` marker on one line only exempts that line.
              if isinstance(value, list):
                  out = []
                  for v in value:
                      if isinstance(v, str):
                          out.extend(v.splitlines())
                  return out
              if isinstance(value, str):
                  return value.splitlines()
              return []


          def env_value(env, name):
              # What a step sees of a variable, as a string. Unset, empty and
              # false all mean the same thing to the tools that read them:
              # not set.
              value = env.get(name)
              if value is None or value is False:
                  return ""
              if value is True:
                  return "1"
              return str(value).strip()


          def env_carries_secret(env):
              # Whether the environment a step runs in carries a secret. The
              # environment is the workflow's `env:`, the job's `env:` and the
              # step's `env:` merged, the step's last, because that is what
              # the step's process gets.
              if not env:
                  return False
              return bool(SECRET_RE.search(yaml.safe_dump(env)))


          def apt_source_added(lines):
              # Whether the job adds an apt source that is not the
              # distribution's own. A comment adds nothing.
              for line in lines:
                  stripped = line.lstrip()
                  if not stripped or stripped.startswith("#"):
                      continue
                  if APT_SOURCE_RE.search(line):
                      return True
              return False


          def apt_from_archive(line):
              # Whether the install names packages the distribution's own
              # metadata resolves, and keeps the archive's signature check on.
              if APT_INSECURE_RE.search(line):
                  return False
              match = APT_INSTALL_ARGS_RE.search(line)
              if not match:
                  return False
              args = re.split(r"[|;&<>]", match.group(1))[0]
              for token in args.split():
                  if token.startswith("-"):
                      continue
                  if not APT_PACKAGE_RE.match(token):
                      return False
              return True


          def classify(line, env, apt_tainted):
              # Why this line installs third-party tooling in a job that holds
              # a secret, or None when it installs nothing third-party. The
              # empty string is the case the rules already had, which says
              # nothing beyond the line itself.
              for pattern, except_marker in INSTALL_PATTERNS:
                  if pattern in line and not (
                      except_marker and except_marker in line
                  ):
                      return ""
              if APT_INSTALL_RE.search(line):
                  if apt_tainted:
                      return (
                          "The job adds an apt source of its own, so the "
                          "package does not come from the distribution's own "
                          "archive; install from that archive alone."
                      )
                  if not apt_from_archive(line):
                      return (
                          "The install does not name packages the "
                          "distribution's archive resolves, so nothing in it "
                          "carries the archive's signature; install packages "
                          "by name from that archive."
                      )
                  if env_carries_secret(env):
                      return (
                          "The environment of the step that installs carries a "
                          "secret, so the package's maintainer scripts run as "
                          "root with it in reach; keep the secret out of that "
                          "step's environment."
                      )
                  return None
              if BREW_INSTALL_RE.search(line):
                  return (
                      "A formula is resolved from a tap, where publication is "
                      "on demand."
                  )
              if BREW_TOOL_RE.search(line) and not env_value(env, NO_AUTO_UPDATE):
                  return (
                      "Homebrew updates itself before the command runs unless "
                      "HOMEBREW_NO_AUTO_UPDATE is set, and that update "
                      "installs formulae; set it for the step."
                  )
              return None


          def find_violations(spec_path):
              violations = []
              try:
                  with open(spec_path) as fh:
                      spec = yaml.safe_load(fh)
              except yaml.YAMLError as e:
                  # Silent skip would hide a misconfigured workflow that the
                  # caller is going to learn about elsewhere in CI for the
                  # wrong reason. Warning annotation instead.
                  print(f"::warning file={spec_path}::skipped: YAML parse error: {e}")
                  return violations
              if not isinstance(spec, dict):
                  return violations
              workflow_env = spec.get("env")
              workflow_env = workflow_env if isinstance(workflow_env, dict) else {}
              jobs = spec.get("jobs") or {}
              for job_id, job in jobs.items():
                  if not isinstance(job, dict):
                      continue
                  # Re-serialize the job so `with:`, `env:`, `if:` and
                  # `run:` strings are all scanned for a secret reference.
                  # Comments are stripped by safe_load, so they cannot
                  # produce a false positive.
                  job_text = yaml.safe_dump(job)
                  if not SECRET_RE.search(job_text):
                      continue
                  steps = [
                      s for s in (job.get("steps") or [])
                      if isinstance(s, dict)
                  ]
                  job_env = job.get("env")
                  job_env = job_env if isinstance(job_env, dict) else {}
                  # A job that adds an apt source of its own is not talking
                  # to the distribution's archive any more, and every install
                  # in it is third-party from then on.
                  apt_tainted = apt_source_added(
                      [l for s in steps for l in normalize_run(s.get("run"))]
                  )
                  for step in steps:
                      uses = step.get("uses")
                      if isinstance(uses, str) and not uses.startswith("./"):
                          owner = uses.split("/", 1)[0].lower()
                          if owner not in FIRST_PARTY_OWNERS:
                              violations.append((spec_path, job_id, f"uses: {uses}", ""))
                      run = step.get("run")
                      if run is None:
                          continue
                      step_env = step.get("env")
                      step_env = step_env if isinstance(step_env, dict) else {}
                      env = dict(workflow_env)
                      env.update(job_env)
                      env.update(step_env)
                      for line in normalize_run(run):
                          stripped = line.lstrip()
                          if not stripped or stripped.startswith("#"):
                              continue
                          why = classify(line, env, apt_tainted)
                          if why is None:
                              continue
                          violations.append((spec_path, job_id, line, why))
              return violations


          def main():
              files = sorted(set(
                  glob.glob(".github/workflows/*.yml")
                  + glob.glob(".github/workflows/*.yaml")
              ))
              violations = []
              for path in files:
                  violations.extend(find_violations(path))
              if violations:
                  for path, job_id, line, why in violations:
                      because = f" {why}" if why else ""
                      print(
                          f"::error file={path}::job `{job_id}` installs third-party "
                          f"tooling while holding a secret: `{line.strip()}`.{because} "
                          "See Glyndor/apt#121. Fix by moving the install into a "
                          "job that holds no secrets, or pin it by hash "
                          "(e.g. `pip install --require-hashes`)."
                      )
                  sys.exit(1)
              print(
                  "tooling-isolation: no job holding a secret installs third-party tooling."
              )
              sys.exit(0)


          if __name__ == "__main__":
              sys.exit(main())
          PY
