name: Workflow lint (reusable)

# Lint the CALLING repository's own workflow YAML with actionlint: the release
# workflows and other per-repo callers that live outside this repository and
# are today validated by nobody. This is where the phantom-required-check
# naming mismatches and the PowerShell $VAR-under-pwsh trap have actually
# shipped, because nothing caught them before a consumer's CI ran for real.
# Contrast with workflow-lint.yml in this repository: that one is this repo's own
# self-CI over ITS reusables; this one runs actionlint over the CALLER's
# checkout, wherever the calling job invokes it from.
#
# actionlint's embedded shellcheck pass otherwise falls back to whatever
# shellcheck the runner image ships, which floats independently of the org's
# pinned version (reusable-shell-ci.yml). Installing the same pinned shellcheck here
# and pointing actionlint at it with -shellcheck keeps that pass reproducible
# too.

on:
  workflow_call:
    inputs:
      shellcheck-version:
        description: Exact shellcheck release tag to install from koalaman/shellcheck for actionlint's embedded shellcheck pass; bumped here and in the sibling channels together
        type: string
        default: "v0.11.0"
      shellcheck-sha256:
        description: sha256 of that release's linux.x86_64 tarball; travels with shellcheck-version, so overriding one without the other fails the install
        type: string
        default: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
      tooling-isolation:
        description: Fail when a job that holds a secret also installs third-party tooling
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.workflow }}-${{ github.ref }}
  # Only a pull request supersedes its own earlier run. A push to main is a
  # distinct commit that has to be judged on its own, and the suite-on-main
  # watcher reads those verdicts; a cron run is never replaced by the next.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    # Bound: 15 to 28s measured, and it installs actionlint and shellcheck.
    # Ten times that, rounded up, never under ten minutes; the six-hour
    # default is what a hang would otherwise cost.
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: v1.7.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      # Every suite under tests/ must be run by a workflow on a pull request.
      #
      # tests/ci/suites/ci-runs-every-test.test.sh asserts this from inside
      # the test job, and a pull request that drops it from the test-command
      # with other suites leaves that job green: the watcher shares the fate
      # of the list it watches. This is a different job and a different
      # check, so it sees the list emptied.
      #
      # It runs before the scope decision and on every event, because adding
      # a suite without wiring it touches only tests/, which the scope below
      # does not count as a workflow-lint input, and it reads two directories
      # and costs about a second.
      #
      # The checker is taken from the base commit on a pull request, as the
      # scope helper below is, so a pull request cannot weaken the checker
      # that judges it. A base without it (first adoption) or another event
      # uses the checkout's copy, and a checkout without it fails. The list
      # of exempt suites is a file of the repository and is read from the
      # base commit too, so the pull request cannot exempt what it unwires;
      # the checker counts an exemption only when both copies carry it.
      - name: Every suite is run by a workflow
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          checker=scripts/quality/check-suites-wired.sh
          exemptions=scripts/quality/suite-exemptions.txt
          script="$(mktemp "$RUNNER_TEMP/suites-wired.XXXXXX")"
          trap 'rm -f "$script" "$script.exempt"' EXIT
          if [ "$EVENT" = pull_request ] \
            && git show "HEAD^1:$checker" > "$script" 2>/dev/null; then
            echo "Checker read from the base commit."
          else
            cp "$checker" "$script"
          fi
          base_exemptions=""
          if [ "$EVENT" = pull_request ] \
            && git show "HEAD^1:$exemptions" > "$script.exempt" 2>/dev/null; then
            base_exemptions="$script.exempt"
          fi
          SUITE_EXEMPTIONS_BASE="$base_exemptions" bash "$script" "$PWD"

      # Keep the required check present. Read the classifier from the PR base,
      # so a changed helper cannot skip its own validation. First adoption (no
      # base helper), unknown output or a failed diff means a full run.
      - name: Decide whether workflow-lint is needed
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          SCOPE_JOB: workflow-lint
        run: |
          set -euo pipefail
          needed=true
          script="$(mktemp "$RUNNER_TEMP/lint-scope.XXXXXX")"
          trap 'rm -f "$script"' EXIT
          if [ "$EVENT" = pull_request ] \
            && git show HEAD^1:scripts/quality/ci-job-scope.sh > "$script" 2>/dev/null; then
            if decision="$(bash "$script" "$SCOPE_JOB")" \
              && [[ "$decision" == true || "$decision" == false ]]; then
              needed="$decision"
            fi
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          if [ "$needed" = false ]; then
            echo "No changed inputs for $SCOPE_JOB; expensive steps skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Running $SCOPE_JOB (changed inputs or scope not established)."
          fi

      - if: steps.scope.outputs.needed != 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: actionlint-cache
        with:
          path: ~/go/bin/actionlint
          key: actionlint-${{ runner.os }}-${{ env.ACTIONLINT_VERSION }}

      # `stable` rather than a number, and this is the one pin in this file that
      # is deliberately absent.
      #
      # This Go compiles nothing of ours. It exists to build actionlint, and
      # what has to be reproducible there is the tool, which is pinned by
      # ACTIONLINT_VERSION and keyed into the cache by it. The compiler that
      # assembles it is not part of that claim.
      #
      # A number here has no update path. Dependabot's github-actions ecosystem
      # does not touch a tool version written inside a workflow, so it moves
      # only when somebody remembers, and nothing turns red when it stops being
      # supported: Go keeps the last two releases, so a frozen number silently
      # becomes an unsupported compiler while the job stays green. It sat at
      # 1.26 with 1.27 out, which is how this was noticed.
      - if: steps.scope.outputs.needed != 'false' && steps.actionlint-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable

      - name: Install actionlint
        if: steps.scope.outputs.needed != 'false' && steps.actionlint-cache.outputs.cache-hit != 'true'
        run: go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"

      # A cache hit skips setup-go, which is what used to put the Go bin
      # directory on PATH, so say where the restored binary is.
      - name: Put actionlint on PATH
        if: steps.scope.outputs.needed != 'false'
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Install shellcheck
        if: steps.scope.outputs.needed != 'false'
        env:
          SHELLCHECK_VERSION: ${{ inputs.shellcheck-version }}
          SHELLCHECK_SHA256: ${{ inputs.shellcheck-sha256 }}
        run: |
          set -euo pipefail
          # Same verified-download idiom as reusable-shell-ci.yml: pinned by tag rather
          # than whatever the runner image preinstalls, and checked against the
          # release's sha256 before extraction, since a plain HTTPS fetch has no
          # registry behind it vouching for what came back.
          dir="$RUNNER_TEMP/shellcheck-bin"
          tarball="$RUNNER_TEMP/shellcheck.tar.xz"
          mkdir -p "$dir"
          curl -sSfL -o "$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$tarball" | sha256sum -c -
          tar -xJ -f "$tarball" -C "$dir" --strip-components=1 "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          chmod +x "$dir/shellcheck"
          echo "SHELLCHECK_BIN=$dir/shellcheck" >> "$GITHUB_ENV"

      - name: Run actionlint over the caller's workflows
        if: steps.scope.outputs.needed != 'false'
        env:
          SHELLCHECK_BIN: ${{ env.SHELLCHECK_BIN }}
        run: actionlint -color "-shellcheck=${SHELLCHECK_BIN}"

      # The two rules below are scripts, and on a pull request the copy that
      # runs is the one in the base commit, as check-suites-wired.sh above is,
      # so a pull request cannot rewrite the rule that judges it. The cost is
      # deliberate: a pull request that changes a rule is judged by the rule as
      # it was, its own suite tests the new form, and the new form judges from
      # the next pull request on. A base without the script (first adoption)
      # or another event uses the checkout's copy, and a checkout without it
      # fails. The rules read nothing else from the repository but the
      # workflows they judge, which come from the checkout.
      - name: Take the rule scripts from the base commit
        if: steps.scope.outputs.needed != 'false'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/lint-rules"
          mkdir -p "$dir"
          for rule in check-test-job-not-switchable.sh check-tooling-isolation.sh; do
            if [ "$EVENT" = pull_request ] \
              && git show "HEAD^1:scripts/quality/$rule" > "$dir/$rule" 2>/dev/null; then
              echo "$rule read from the base commit."
            else
              cp "scripts/quality/$rule" "$dir/$rule"
            fi
          done

      # A required test job must not be switchable off: every caller of
      # reusable-shell-ci.yml passes a test-command that runs a suite, carries
      # no job-level `if:` or `needs:`, and at least one caller exists. The
      # rule and its reasons are in the script, taken as above. It runs here
      # rather than in the shell job because that is the job an `if:` would
      # skip, and a check inside it would share the fate of what it checks.
      - name: A required test job must not be switchable off
        if: steps.scope.outputs.needed != 'false'
        run: bash "$RUNNER_TEMP/lint-rules/check-test-job-not-switchable.sh"

      # A job that holds a secret must not install third-party tooling, since
      # an installer runs code nobody here wrote with that secret in reach.
      # The exemptions (a hash-pinned pip install, the distribution's own apt
      # archive) and their edges are in the script.
      - name: A job holding a secret must not install third-party tooling
        if: ${{ inputs.tooling-isolation && steps.scope.outputs.needed != 'false' }}
        run: bash "$RUNNER_TEMP/lint-rules/check-tooling-isolation.sh"
