name: Line limit

# Enforces the org file-size standard (soft 300 / hard 500 code lines) via the
# shared reusable, as every product repo already does.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  line-limit:
    uses: Glyndor/.github/.github/workflows/line-limit.yml@8ae47ccd49ffdbf59d1acf7e6f9c18165bfba959 # v1.19.0
