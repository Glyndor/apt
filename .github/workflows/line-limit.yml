name: Line limit

# Enforces the org file-size standard (soft 300 / hard 500 code lines) via the
# shared reusable, as every product repo already does.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  line-limit:
    uses: Glyndor/.github/.github/workflows/line-limit.yml@d4bbc5b6ec0c351ca4cb17d948ceaad818da4078 # v1.18.1
