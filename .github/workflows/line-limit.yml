name: Line limit

# Enforces the org file-size standard (soft 300 / hard 500 code lines) via the
# shared reusable, as every product repo already does.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  line-limit:
    uses: Glyndor/.github/.github/workflows/line-limit.yml@c958978687af37dc2d826a967d9c549589afb39f # v1.14.1
