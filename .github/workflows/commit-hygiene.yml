name: commit hygiene

# Two things history cannot take back, checked before a pull request merges: a
# personal email address in a commit, and something shaped like a credential in
# the lines it adds. Shell only, no third-party tooling, so neither job needs a
# secret or a network.
#
# Both jobs check out the head of the pull request, so the scripts in that checkout are
# the pull request's own. Each step therefore reads its script from the base commit and
# runs that copy: a change that rewrote a script to pass would otherwise be judged by
# itself. A change to either script is judged by the rule the base holds and takes
# effect once it is merged.
#
# The dco check only asks for "a name and an address" and passed thirty-four
# commits signed off with a personal one; GitHub's push protection knows the
# formats of other people's tokens, not a signing key of our own.

on:
  pull_request:
    branches: ["main"]

permissions: {}

concurrency:
  group: commit-hygiene-${{ github.workflow }}-${{ github.ref }}
  # A newer push to the same pull request supersedes the earlier run: the
  # earlier one answers a question about a commit that no longer exists, and
  # both jobs check out the whole history to answer it. The expression is the
  # one the rest of this repository uses, so a push trigger added here later
  # would not cancel a commit that has to be judged on its own.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commit-identity:
    name: commit identity
    # ubuntu-latest on purpose: this job only asks GitHub or git for data and
    # compares strings, so a new image cannot change its verdict.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit uses a GitHub noreply address
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          identity="$(mktemp "$RUNNER_TEMP/check-commit-identity.XXXXXX")"
          git show "$BASE:scripts/quality/hygiene/check-commit-identity.sh" > "$identity"
          bash "$identity" "$BASE" "$HEAD"

  secret-scan:
    name: secret scan
    # ubuntu-latest on purpose: this job only asks GitHub or git for data and
    # compares strings, so a new image cannot change its verdict.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: The change adds no credential-shaped line
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          scan="$(mktemp "$RUNNER_TEMP/check-secrets.XXXXXX")"
          git show "$BASE:scripts/quality/hygiene/check-secrets.sh" > "$scan"
          bash "$scan" "$BASE" "$HEAD"
