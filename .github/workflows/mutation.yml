name: Mutation

# The catalogue of mutations: every entry breaks one guard of the scripts of this
# repository on purpose and names the tests that must notice. A guard that no test
# notices is decoration, and the catalogue is what keeps that from being a matter
# of opinion: it is checked here against the guards as they stand.
#
# Weekly and on demand, every entry. On a pull request, only the entries the
# change can affect, and none when it can affect none: the whole sweep takes about
# half an hour, and a change that touches no mutated script, no suite an entry
# names, nothing those suites read and not the catalogue cannot change whether a
# catalogued guard is still noticed. scripts/quality/scope/mutation-scope.sh decides,
# from the copy in the base commit, and fails open to every entry. That a guard
# has an entry at all is checked on every pull request by
# tests/quality/coverage/check-mutation-coverage.test.sh, in the suite job, where it costs
# a second.
#
# The sweep copies the tree with `git archive HEAD` and runs the suites against
# that copy, so it judges the repository as it is committed and not as it is in
# the working directory of whoever ran it. The copy carries no git metadata, so
# the suites that need it are excluded by the runner; which ones those are, and
# why, is written down in tests/mutation/catalog.txt, which holds the catalogue with
# the files of tests/mutation/catalog.d/.
#
# The `gate` job is the one to read, and the one to require once it has failed
# for its reason on a real pull request: the sweep job is skipped when nothing
# needs it, and a skipped job reports success whether it was skipped because the
# decision said so or because the decision failed. The gate tells the two apart.

on:
  pull_request:
  schedule:
    - cron: "23 4 * * 1" # Monday, 04:23 UTC: a minute nobody else takes
    # A single run, on 24 November at 10:23 UTC, to try the sweep by fragments on a runner and give the
    # freshness watcher the scheduled run it has not had: the one of 23 November was cut at its bound,
    # and a manual run is not a scheduled one. The pull request that replaces the estimated durations
    # in tests/mutation/sweep-durations.txt by the measured ones removes this line; left in, it would
    # fire every 24 November.
    - cron: "23 10 24 11 *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The group is per run outside a pull request. A group shared by the schedule and a
  # manual run lets GitHub drop the run that is still waiting when a newer one queues, even
  # with `cancel-in-progress: false`, and a scheduled run that never ends is one the
  # freshness watcher can never count. tests/ci/policy/rules/cancel-policy.test.sh holds
  # this for every workflow that has a schedule.
  group: mutation-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  # A newer push replaces a pull request's run; a scheduled run is never
  # replaced by the next one (see cancel-policy.test.sh).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  decide:
    name: which entries this change can affect
    runs-on: ubuntu-latest
    # Bound: 0.07 seconds measured locally for the decision, plus the
    # checkout. Five minutes bounds a hang; the six-hour default is what a hang
    # would otherwise cost.
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
      ids: ${{ steps.scope.outputs.ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Decide from the base commit
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # The decision is taken by the copy in the base commit, so a pull
          # request cannot narrow its own sweep. A base without it, a decision
          # that cannot be read or a name that is not an id runs every entry.
          decision=all
          script="$(mktemp "$RUNNER_TEMP/mutation-scope.XXXXXX")"
          trap 'rm -f "$script"' EXIT
          if [ "$EVENT" = pull_request ] \
            && git show HEAD^1:scripts/quality/scope/mutation-scope.sh > "$script" 2>/dev/null; then
            if out="$(EVENT="$EVENT" bash "$script")"; then
              decision="$out"
            fi
          fi
          ids=""
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            if [ "$id" = all ] || ! [[ "$id" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
              ids=all
              break
            fi
            ids="${ids:+$ids }$id"
          done <<< "$decision"
          if [ -z "$ids" ]; then
            run=false
            echo "No catalogued guard can be affected by this change; the sweep is not needed." >> "$GITHUB_STEP_SUMMARY"
          else
            run=true
            echo "Mutation entries to run: $ids" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"

  mutations:
    name: the guards still die under their mutations
    needs: decide
    # Skipped only when the decision answered `false`. A decision that failed or
    # answered nothing leaves the output empty, and an empty output is not a
    # `false`: the sweep runs every entry, and the gate below is what fails.
    # !cancelled() so that it starts when the decision failed, and not in a run
    # that was cancelled.
    if: ${{ !cancelled() && needs.decide.outputs.run != 'false' }}
    # ubuntu-latest resolved to ubuntu-26.04 in apt's publish runs on
    # 2026-11-20. The image is named because this job's verdict depends on the
    # tools it ships, so a new image arrives as a commit and not overnight.
    runs-on: ubuntu-26.04
    # One job for each file of the catalogue, so a full sweep takes as long as its largest file and
    # not as long as all of them. The whole sweep in one job took 60 minutes on 2026-11-23 against a
    # bound of 90, and the catalogue grows with every refusal. A job that exceeds its bound is
    # reported by GitHub as `cancelled`: not a success, so the freshness watcher cannot count it.
    # The bound of each fragment is its measured time, in tests/mutation/sweep-durations.txt, scaled
    # to the entries it has and with a half on top; the policy suite named below fails the pull
    # request that makes a fragment outgrow it, and the one that adds a file of the catalogue that is
    # not listed here. A pull request runs a fraction: each fragment runs only the selected entries
    # that it holds, and ends at once when it holds none. A fragment that fails does not stop the rest.
    # tests/ci/policy/mutation-sweep-is-split-and-bounded.test.sh holds all of it.
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - fragment: tests/mutation/catalog.txt
            minutes: 55
          - fragment: tests/mutation/catalog.d/callers.txt
            minutes: 10
          - fragment: tests/mutation/catalog.d/hygiene.txt
            minutes: 10
          - fragment: tests/mutation/catalog.d/instrument.txt
            minutes: 10
          - fragment: tests/mutation/catalog.d/switch-rule.txt
            minutes: 40
          - fragment: tests/mutation/catalog.d/scope.txt
            minutes: 10
          - fragment: tests/mutation/catalog.d/live.txt
            minutes: 10
          - fragment: tests/mutation/catalog.d/gaps.txt
            minutes: 10
          - fragment: tests/mutation/catalog.d/gaps-archive.txt
            minutes: 20
          - fragment: tests/mutation/catalog.d/baseline.txt
            minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every mutation is killed by a test
        env:
          IDS: ${{ needs.decide.outputs.ids }}
          FRAGMENT: ${{ matrix.fragment }}
        run: |
          set -euo pipefail
          selected=()
          if [ "$IDS" != all ]; then
            held="$(./tests/mutation/run-mutations.sh --catalog "$FRAGMENT" --list)"
            for id in $IDS; do
              if grep -qxF -- "$id" <<< "$held"; then selected+=("$id"); fi
            done
            if [ "${#selected[@]}" -eq 0 ]; then
              echo "None of the selected entries is in $FRAGMENT."
              exit 0
            fi
          fi
          ./tests/mutation/run-mutations.sh --catalog "$FRAGMENT" "${selected[@]}"

  gate:
    name: gate
    needs: [decide, mutations]
    if: always()
    runs-on: ubuntu-latest
    # Bound: it reads three values. Five minutes bounds a hang.
    timeout-minutes: 5
    steps:
      - name: Tell a sweep that was not needed from one that did not run
        env:
          DECIDE: ${{ needs.decide.result }}
          RUN: ${{ needs.decide.outputs.run }}
          SWEEP: ${{ needs.mutations.result }}
        run: |
          set -euo pipefail
          if [ "$DECIDE" != success ]; then
            echo "::error::the decision ended $DECIDE, so nothing says the sweep was not needed"
            exit 1
          fi
          case "$RUN:$SWEEP" in
            false:skipped)
              echo "The decision found no catalogued guard this change can affect."
              ;;
            true:success)
              echo "The sweep ran and every selected mutation was killed."
              ;;
            *)
              echo "::error::the decision said run=$RUN and the sweep ended $SWEEP"
              exit 1
              ;;
          esac
