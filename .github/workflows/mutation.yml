name: Mutation

# The catalogue of mutations: every entry breaks one guard of the scripts of this
# repository on purpose and names the tests that must notice. A guard that no test
# notices is decoration, and the catalogue is what keeps that from being a matter
# of opinion: it is checked here against the guards as they stand.
#
# Weekly and on demand, every entry. On a pull request, only the entries the
# change can affect, and none when it can affect none: the whole sweep takes about
# half an hour, and a change that touches no mutated script, no suite an entry
# names, nothing those suites read and not the catalogue cannot change whether a
# catalogued guard is still noticed. scripts/quality/scope/mutation-scope.sh decides,
# from the copy in the base commit, and fails open to every entry. That a guard
# has an entry at all is checked on every pull request by
# tests/quality/coverage/check-mutation-coverage.test.sh, in the suite job, where it costs
# a second.
#
# The sweep copies the tree with `git archive HEAD` and runs the suites against
# that copy, so it judges the repository as it is committed and not as it is in
# the working directory of whoever ran it. The copy carries no git metadata, so
# the suites that need it are excluded by the runner; which ones those are, and
# why, is written down in tests/mutation/catalog.txt, which holds the catalogue with
# the files of tests/mutation/catalog.d/.
#
# The `gate` job is the one to read, and the one to require once it has failed
# for its reason on a real pull request: the sweep job is skipped when nothing
# needs it, and a skipped job reports success whether it was skipped because the
# decision said so or because the decision failed. The gate tells the two apart.

on:
  pull_request:
  schedule:
    - cron: "23 4 * * 1" # Monday, 04:23 UTC: a minute nobody else takes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  # A newer push replaces a pull request's run; a scheduled run is never
  # replaced by the next one (see cancel-policy.test.sh).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  decide:
    name: which entries this change can affect
    runs-on: ubuntu-latest
    # Bound: 0.07 seconds measured locally for the decision, plus the
    # checkout. Five minutes bounds a hang; the six-hour default is what a hang
    # would otherwise cost.
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
      ids: ${{ steps.scope.outputs.ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Decide from the base commit
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # The decision is taken by the copy in the base commit, so a pull
          # request cannot narrow its own sweep. A base without it, a decision
          # that cannot be read or a name that is not an id runs every entry.
          decision=all
          script="$(mktemp "$RUNNER_TEMP/mutation-scope.XXXXXX")"
          trap 'rm -f "$script"' EXIT
          if [ "$EVENT" = pull_request ] \
            && git show HEAD^1:scripts/quality/scope/mutation-scope.sh > "$script" 2>/dev/null; then
            if out="$(EVENT="$EVENT" bash "$script")"; then
              decision="$out"
            fi
          fi
          ids=""
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            if [ "$id" = all ] || ! [[ "$id" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
              ids=all
              break
            fi
            ids="${ids:+$ids }$id"
          done <<< "$decision"
          if [ -z "$ids" ]; then
            run=false
            echo "No catalogued guard can be affected by this change; the sweep is not needed." >> "$GITHUB_STEP_SUMMARY"
          else
            run=true
            echo "Mutation entries to run: $ids" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"

  mutations:
    name: the guards still die under their mutations
    needs: decide
    if: needs.decide.outputs.run == 'true'
    # ubuntu-latest resolved to ubuntu-26.04 in apt's publish runs on
    # 2026-11-20. The image is named because this job's verdict depends on the
    # tools it ships, so a new image arrives as a commit and not overnight.
    runs-on: ubuntu-26.04
    # Bound, measured on 2026-11-21: every entry (242 then) took 31 minutes 35
    # seconds on a loaded workstation, and 30 minutes 38 seconds on the first
    # run of a GitHub runner, where the next one took about 15. Each entry is a
    # copy of the tree and the suite it names. A pull request runs a fraction:
    # 2.5 seconds for the 7 entries a README change selects, about 10 minutes
    # for the 43 a change to build-repo.sh selects. Ninety is nearly three
    # times the longest full sweep and still bounds a hang; the six-hour
    # default is what a hang would otherwise cost. The catalogue grows with
    # every refusal, so the sweep does too: raise this when a full sweep passes 45 minutes.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every mutation is killed by a test
        env:
          IDS: ${{ needs.decide.outputs.ids }}
        run: |
          set -euo pipefail
          selected=()
          if [ "$IDS" != all ]; then
            read -r -a selected <<< "$IDS"
          fi
          ./tests/mutation/run-mutations.sh "${selected[@]}"

  gate:
    name: gate
    needs: [decide, mutations]
    if: always()
    runs-on: ubuntu-latest
    # Bound: it reads three values. Five minutes bounds a hang.
    timeout-minutes: 5
    steps:
      - name: Tell a sweep that was not needed from one that did not run
        env:
          DECIDE: ${{ needs.decide.result }}
          RUN: ${{ needs.decide.outputs.run }}
          SWEEP: ${{ needs.mutations.result }}
        run: |
          set -euo pipefail
          if [ "$DECIDE" != success ]; then
            echo "::error::the decision ended $DECIDE, so nothing says the sweep was not needed"
            exit 1
          fi
          case "$RUN:$SWEEP" in
            false:skipped)
              echo "The decision found no catalogued guard this change can affect."
              ;;
            true:success)
              echo "The sweep ran and every selected mutation was killed."
              ;;
            *)
              echo "::error::the decision said run=$RUN and the sweep ended $SWEEP"
              exit 1
              ;;
          esac
