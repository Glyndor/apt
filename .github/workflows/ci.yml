name: CI

# Runs the shared shell lint plus this repository's build-script tests on every
# pull request and push to main, so a regression in the fail-closed signature
# gate (scripts/verify-debs.sh) is caught before it can reach the publish
# workflow. The logic lives in the org's reusable shell-ci workflow.
#
# `pin-policy` and `dependabot-freshness` are the per-repo guard pair
# (PR rollout #3-#7 of the pin-policy refactor). Both run against this
# repository's own state with the caller workflow's GITHUB_TOKEN, so a
# private repository or a stale reusable pin is no longer invisible to
# the guard. The cross-repo form that lived on .github's own schedule
# was retired in PR #119.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shell:
    uses: Glyndor/.github/.github/workflows/shell-ci.yml@118244b8d758bdec6d2c5115d815dbc2e5c4f4e9 # v1.16.0
    with:
      test-command: ./tests/verify-debs.test.sh && ./tests/verify-published.test.sh && ./tests/build-keyring.test.sh && ./tests/purge-cache.test.sh && ./tests/build-index-page.test.sh
      apt-packages: python3-cryptography
  empty-diff:
    if: github.event_name == 'pull_request'
    uses: Glyndor/.github/.github/workflows/empty-diff.yml@118244b8d758bdec6d2c5115d815dbc2e5c4f4e9 # v1.16.0
  pin-policy:
    uses: Glyndor/.github/.github/workflows/pin-policy-reusable.yml@118244b8d758bdec6d2c5115d815dbc2e5c4f4e9 # v1.16.0
  dependabot-freshness:
    uses: Glyndor/.github/.github/workflows/dependabot-freshness.yml@118244b8d758bdec6d2c5115d815dbc2e5c4f4e9 # v1.16.0
    with:
      max-age-days: 15

  # A cron that stops firing emits nothing, and "no alert" is indistinguishable
  # from "all clear". Every scheduled workflow in this org went dark on
  # 2026-06-29 and four repos stayed dark for another four weeks, all reporting
  # `active` throughout. This turns the absence of a scheduled run into a red
  # check on ordinary work.

  freshness-publish:
    permissions:
      contents: read
      actions: read
    uses: Glyndor/.github/.github/workflows/schedule-freshness.yml@118244b8d758bdec6d2c5115d815dbc2e5c4f4e9 # v1.16.0
    with:
      workflow: publish.yml
      max-age-days: 3

  freshness-health-check:
    permissions:
      contents: read
      actions: read
    uses: Glyndor/.github/.github/workflows/schedule-freshness.yml@118244b8d758bdec6d2c5115d815dbc2e5c4f4e9 # v1.16.0
    with:
      workflow: health-check.yml
      max-age-days: 1
