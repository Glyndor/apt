name: CI

# Runs the shell lint plus this repository's build-script tests on every pull
# request and push to main, so a regression in the fail-closed signature gate
# (scripts/verify-debs.sh) is caught before it can reach the publish workflow.
#
# Every job here calls a reusable that lives in THIS repository, under
# .github/workflows/reusable-*.yml. Nothing is pulled from Glyndor/.github any
# more. A local call emits the same `<caller job id> / <inner job name>` check
# name a remote one does — read off a real run in PR #124 — so the required
# check names are unchanged and the ruleset was never touched.
#
# `pin-policy` used to run here and is gone. Its script compares this
# repository's Glyndor reusable pins against Glyndor/.github's latest tag, and
# there are no such pins left to compare. It was not a required status check,
# so removing it left no phantom behind.
#
# `dependabot-freshness` stays: it watches whether Dependabot is still
# proposing updates at all, which is about this repository's own config rather
# than about anything upstream.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shell:
    uses: ./.github/workflows/reusable-shell-ci.yml
    with:
      test-command: ./tests/verify-debs.test.sh && ./tests/verify-published.test.sh && ./tests/build-keyring.test.sh && ./tests/purge-cache.test.sh && ./tests/build-index-page.test.sh && ./tests/build-installers.test.sh && ./tests/install-template.test.sh && ./tests/readme-bootstrap.test.sh && ./tests/build-repo.test.sh && ./tests/check-test-coverage.test.sh && ./tests/publish-workflow.test.sh && ./tests/install-template-behaviour.test.sh
      apt-packages: python3-cryptography reprepro
  empty-diff:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/reusable-empty-diff.yml
  dependabot-freshness:
    uses: ./.github/workflows/reusable-dependabot-freshness.yml
    with:
      max-age-days: 15

  # A cron that stops firing emits nothing, and "no alert" is indistinguishable
  # from "all clear". Every scheduled workflow in this org went dark on
  # 2026-06-29 and four repos stayed dark for another four weeks, all reporting
  # `active` throughout. This turns the absence of a scheduled run into a red
  # check on ordinary work.

  freshness-publish:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-schedule-freshness.yml
    with:
      workflow: publish.yml
      max-age-days: 3

  freshness-health-check:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-schedule-freshness.yml
    with:
      workflow: health-check.yml
      max-age-days: 1
