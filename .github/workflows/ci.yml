name: CI

# Runs the shared shell lint plus this repository's build-script tests on every
# pull request and push to main, so a regression in the fail-closed signature
# gate (scripts/verify-debs.sh) is caught before it can reach the publish
# workflow. The logic lives in the org's reusable shell-ci workflow.
#
# `pin-policy` and `dependabot-freshness` are the per-repo guard pair
# (PR rollout #3-#7 of the pin-policy refactor). Both run against this
# repository's own state with the caller workflow's GITHUB_TOKEN, so a
# private repository or a stale reusable pin is no longer invisible to
# the guard. The cross-repo form that lived on .github's own schedule
# was retired in PR #119.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shell:
    uses: Glyndor/.github/.github/workflows/shell-ci.yml@3a46ffe91ecadcce7f14c99ea8b23ead4274f325 # v1.13.2
    with:
      test-command: ./tests/verify-debs.test.sh && ./tests/verify-published.test.sh && ./tests/build-keyring.test.sh && ./tests/purge-cache.test.sh && ./tests/build-index-page.test.sh
      apt-packages: python3-cryptography
  empty-diff:
    if: github.event_name == 'pull_request'
    uses: Glyndor/.github/.github/workflows/empty-diff.yml@c958978687af37dc2d826a967d9c549589afb39f # v1.14.1
  pin-policy:
    uses: Glyndor/.github/.github/workflows/pin-policy-reusable.yml@0795ea8b8ad6e69466e99ca530e681d423943cc2 # v1.15.0
  dependabot-freshness:
    uses: Glyndor/.github/.github/workflows/dependabot-freshness.yml@c149c995c10d3ed908489866bafe7d3c97920977 # v1.14.0
    with:
      max-age-days: 15
