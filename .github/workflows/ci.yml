name: CI

# Runs the build-script tests on every pull request and push to main, so a
# regression in the fail-closed signature gate (build/verify-debs.sh) is caught
# before it can reach the publish workflow.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-cryptography shellcheck

      - name: Lint shell scripts
        run: shellcheck -S error build/*.sh tests/*.sh

      - name: Run verify-debs tests
        run: ./tests/verify-debs.test.sh
