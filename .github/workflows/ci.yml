name: CI

# Runs the shared shell lint plus this repository's build-script tests on every
# pull request and push to main, so a regression in the fail-closed signature
# gate (scripts/verify-debs.sh) is caught before it can reach the publish
# workflow. The logic lives in the org's reusable shell-ci workflow.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shell:
    # The test-command/apt-packages inputs ship in .github v1.8.0; bump this
    # pin to that release's SHA before merging (v1.7.0 rejects the inputs).
    uses: Glyndor/.github/.github/workflows/shell-ci.yml@367c6651f8a8055085e7cb1e3c289e68f105e1c4 # v1.7.0
    with:
      test-command: ./tests/verify-debs.test.sh
      apt-packages: python3-cryptography
