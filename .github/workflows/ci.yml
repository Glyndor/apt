name: CI

# Runs the shared shell lint plus this repository's build-script tests on every
# pull request and push to main, so a regression in the fail-closed signature
# gate (scripts/verify-debs.sh) is caught before it can reach the publish
# workflow. The logic lives in the org's reusable shell-ci workflow.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shell:
    uses: Glyndor/.github/.github/workflows/shell-ci.yml@045903bf83a58651f119bc7d952aa45242b897c5 # v1.12.0
    with:
      test-command: ./tests/verify-debs.test.sh && ./tests/verify-published.test.sh && ./tests/build-keyring.test.sh && ./tests/purge-cache.test.sh && ./tests/build-index-page.test.sh
      apt-packages: python3-cryptography
