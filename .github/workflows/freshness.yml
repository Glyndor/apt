name: Freshness

# Watchers for things whose failure mode is silence.
#
# A cron that stops firing emits nothing, and "no alert" is indistinguishable
# from "all clear". Every scheduled workflow in this org went dark on
# 2026-06-29 and four repositories stayed dark for another four weeks, all
# reporting `active` throughout. These jobs turn the ABSENCE of a scheduled run
# into a red check on ordinary work, which is the only place anyone would see
# it.
#
# dependabot-freshness watches the same shape from the other side: a
# dependabot.yml sitting in the repository is not proof Dependabot is running,
# because registration is lost when the config stops changing on the default
# branch.
#
# suite-on-main watches a second kind of silence, one that is not about a cron
# at all. The suite reports on the commit it ran for, so a run still reporting
# when a merge lands finishes against a closed pull request and is shown to
# nobody. That job reads the verdict on main and says it out loud here, which is
# the one place a red main is visible on ordinary work.
#
# Separate from the test suite on purpose. These fail because something did not
# happen elsewhere, never because this pull request is wrong, and reading them
# in the same file as the tests invites treating them as flakes.
#
# Pull request, push to main, and a schedule of its own. A repository that
# goes quiet stops checking its own freshness, and nothing automated writes
# this repository's git, so a still repo is the failure mode this catches
# and the cron below is what makes it visible without a person pushing.
#
# No job in this file may be promoted to a required check. A required check
# has to be one every author can satisfy by fixing their own change, and
# none of these can: they go red when a cron elsewhere stopped firing, which
# would block every pull request until somebody repaired the other thing.

on:
  # A watcher with no schedule only watches while somebody is already looking.
  # Until this was added, these checks fired on pull_request and push and
  # nothing else, and apt writes nothing to its own git, so a publish that
  # stopped would have gone unreported until a human next visited the
  # repository. The freshness thresholds below are measured in days; a watcher
  # that runs only when a person happens to push cannot honour a one-day one.
  #
  # Twice a day rather than daily, because the tightest threshold declared
  # below is one day and a daily run leaves no margin: a single skipped firing
  # (GitHub drops scheduled runs under load, and delays them by up to an hour
  # routinely) would put the check past its own limit before it ever ran.
  #
  # 08:13 and 20:13 rather than on the hour: GitHub queues everyone's :00 and
  # :30 crons together, and the other schedules in this repository already sit
  # there. The morning run is deliberately after the daily publish and update
  # windows, so a successful run of the workflow it watches is already on
  # record by the time it looks.
  schedule:
    - cron: "13 8,20 * * *"
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependabot-freshness:
    uses: ./.github/workflows/reusable-dependabot-freshness.yml
    with:
      max-age-days: 15

  freshness-publish:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-schedule-freshness.yml
    with:
      workflow: publish.yml
      max-age-days: 3

  freshness-health-check:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-schedule-freshness.yml
    with:
      workflow: health-check.yml
      max-age-days: 1

  # The watcher watches itself, and this is the last link rather than a joke.
  #
  # These checks exist to catch a scheduled workflow that stopped firing. Until
  # 2026-08-29 this file had no schedule of its own, so it ran only when somebody
  # pushed; that is fixed. What the fix leaves is one level up: it now has a
  # cron, and nothing watches whether that cron keeps firing. Its silence would
  # read exactly like the silence it exists to break.
  #
  # Deliberately not added in the same change as the schedule.
  # reusable-schedule-freshness fails when no successful scheduled run exists
  # for the workflow it names, and on the day the cron landed there was none, so
  # this would have opened red for a reason that is not a fault. There are now
  # two on record, measured before adding it.
  #
  # Two days rather than one, because the cron runs twice daily and GitHub is
  # late: measured on the first two firings, the 20:13Z slot ran at 22:39Z and
  # the 08:13Z slot at 13:48Z, so delays of two to five and a half hours are
  # ordinary. A one-day threshold on a twice-daily job would sit close enough to
  # its own limit to trip on lateness rather than on failure.
  freshness-itself:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-schedule-freshness.yml
    with:
      workflow: freshness.yml
      max-age-days: 2

  # Reports the verdict of the suite on main, which nothing else does.
  #
  # Measured 2026-09-06: `Tests` failed on main in two of the three channel
  # repositories and stayed red from 19:32 to 19:52, after a pull request merged
  # while its own run was still reporting. The run finished against a closed pull
  # request, so its result had nowhere to appear, and it was found because
  # somebody went looking rather than because anything said so. The jobs above
  # cannot see it: they ask for the newest SUCCESSFUL scheduled run, so a failure
  # is missing from their answer by construction.
  #
  # THIS MUST NOT BECOME A REQUIRED STATUS CHECK.
  #
  #   Required, `suite on main` would be red on every open pull request for as
  #   long as main is broken, the pull request that repairs main included, so the
  #   repair could not merge until main was already green. That turns the failure
  #   this job exists to surface into a deadlock, and the check that reports a
  #   problem must never be the thing standing in front of its fix. It reports;
  #   a person acts on it.
  #
  # Both triggers in the `on:` block above are load-bearing here. The schedule
  # reports a red main on the next tick rather than the next time somebody
  # happens to push, and `push: main` reports it on the landing itself, which is
  # the event that creates the run in question.
  #
  # The comparison lives in scripts/check-suite-on-main.sh rather than in this
  # step, so its three answers can be planted and tested off the network; a step
  # body only a runner can execute is covered by nothing. This file decides when
  # it runs and what it may reach.
  #
  # It reads the API as GITHUB_TOKEN, a job-scoped token on its own rate limit,
  # and reads nothing beyond this repository's own run history. The grant below
  # for reading workflow runs is the whole of what it can reach, and no personal
  # credential is ever used here.
  suite-on-main:
    name: suite on main
    runs-on: ubuntu-latest
    # Bound: the script measures under 0.01s against a stubbed API, so what a
    # run costs is a checkout plus the single API call, and the identical call
    # in reusable-schedule-freshness measures 2 to 15s. Ten times that, rounded
    # up, never under ten minutes; the six-hour default is what a hang would
    # otherwise cost.
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # reading this repository's workflow-run history
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the newest completed suite run on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: ./scripts/check-suite-on-main.sh "$REPO" tests.yml main
