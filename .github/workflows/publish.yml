name: Publish apt repository

# Rebuilds the signed apt repository at https://apt.glyndor.net from the latest
# release of each Glyndor product and publishes it to Cloudflare R2.
#
# Runs once a day and on demand. A new product release is picked up at the
# next scheduled build (or a manual run), so no product needs a write credential
# on this repository to trigger a refresh.
#
# Schedule and on demand, no push or pull_request. This workflow asks whether
# the published archive should be rebuilt from each product's latest release,
# not whether code in this repository changed, so ordinary code events are not
# what triggers it.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

# Serialise publishes. The daily schedule and a manual run can otherwise
# overlap and run two `aws s3 sync --delete` against the same bucket at once,
# racing to a half-deleted, inconsistent index that apt rejects. Never cancel a
# run in flight — a partial sync must always finish.
concurrency:
  group: publish-apt
  cancel-in-progress: false

env:
  # Public base URL the archive is served from. Used by the cache purge and by
  # the read-back verification below, so the two never disagree about which
  # archive this run published.
  ARCHIVE_URL: "https://apt.glyndor.net"
  # Space-separated list of Glyndor repos that publish a .deb release asset
  # named <name>_<version>_<arch>.deb. Add a repo here once it ships one.
  #
  # A bare name means the product ships every architecture in ARCHITECTURES.
  # Append ":arch,arch" to declare a narrower set — "klyradb:amd64" for a
  # product that has no arm64 build. DECLARE it rather than letting a missing
  # .deb pass silently: this archive is rebuilt from scratch and synced with
  # --delete, so a product quietly skipped is a product EVICTED from the served
  # archive. A declared architecture that does not arrive is still a hard error;
  # an undeclared one is never looked for.
  PRODUCTS: "podup epistle"
  # There is no INSTALLERS list. Every product in PRODUCTS gets a bootstrap
  # installer at /install/<product>, derived from PRODUCTS below, with no
  # per-product opt-in.
  #
  # It used to be an opt-in list on the reasoning that serving a package is the
  # archive's business while telling people to pipe a script into a root shell
  # is the product's call. In practice it meant `podup` sat in the archive with
  # no installer and nobody noticed, and the rule the org actually settled on is
  # the opposite: a product that can be installed with `apt install` is a
  # product installable with one `sh` line, and joining the archive joins both
  # at once.
  # Architectures to collect and serve. Must match the reprepro distribution
  # (scripts/build-repo.sh) and keyring/glyndor.sources.
  ARCHITECTURES: "amd64 arm64"

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Measured over the last ten runs: 31 to 50 seconds end to end. The job
    # downloads from GitHub, syncs to R2 and purges Cloudflare, and any of the
    # three can stall; unbounded, a stall holds the concurrency group for six
    # hours and the freshness watchers would be the first to say so. Fifteen
    # minutes is well above an honest run with a larger roster and far below
    # that.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so build-keyring.sh can derive the keyring package
          # version from the date the signing key last changed.
          fetch-depth: 0

      - name: Install reprepro and the signature verifier
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq reprepro python3-cryptography

      - name: Download the latest .deb of each product
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p debs
          # The release assets are attacker-influenced (whoever can publish a
          # product release controls them). The signature check bounds their
          # authenticity but not their volume, so bound count and size here:
          # exactly one .deb per product per arch, and a hard per-file size cap,
          # so a compromised or buggy release can't exhaust runner disk or bloat
          # the served archive. Each product also gets its own directory, so its
          # assets can be verified against its own name below rather than
          # trusted on signature alone.
          MAX_DEB_BYTES=$((300 * 1024 * 1024))
          MAX_SIG_BYTES=4096
          for spec in $PRODUCTS; do
            # "<repo>" or "<repo>:<arch>,<arch>". A bare entry means every
            # architecture the archive serves.
            p="${spec%%:*}"
            if [ "$spec" = "$p" ]; then
              product_archs="$ARCHITECTURES"
            else
              product_archs="$(echo "${spec#*:}" | tr ',' ' ')"
            fi
            # A product cannot declare an architecture the archive does not
            # serve: reprepro would refuse the .deb after it had been downloaded
            # and verified, which is a confusing place to find a typo.
            for a in $product_archs; do
              case " $ARCHITECTURES " in
                *" $a "*) ;;
                *)
                  echo "::error::Glyndor/$p declares architecture $a, which is not in ARCHITECTURES ($ARCHITECTURES)"
                  exit 1
                  ;;
              esac
            done
            [ -n "$product_archs" ] \
              || { echo "::error::Glyndor/$p declares no architectures"; exit 1; }
            echo "::group::$p ($product_archs)"
            # Resolve "latest" exactly once per product and reuse that tag for
            # every arch below. Without this, each `gh release download` call
            # re-resolves "latest" independently, so a release landing mid-run
            # can hand amd64 and arm64 two different tags — a mixed-version
            # archive with no signal that anything went wrong.
            tag="$(gh release view --repo "Glyndor/$p" --json tagName --jq .tagName)" \
              || { echo "::error::could not resolve Glyndor/$p's latest release tag"; exit 1; }
            echo "pinned $p to release $tag"
            # Check the sizes the release actually advertises before pulling
            # any bytes, so an oversized asset can't exhaust runner disk mid-
            # download — the post-download check below is belt-and-braces in
            # case the advertised size ever disagrees with the delivered one.
            assets="$(gh release view "$tag" --repo "Glyndor/$p" --json assets \
                        --jq '.assets[] | "\(.size) \(.name)"')" \
              || { echo "::error::could not list Glyndor/$p's release assets to check sizes before download"; exit 1; }
            # Emit size before name and read name last: an attacker picks the
            # asset name, and `read` splits on the first space(s) into all but
            # the last variable, so a name containing a space would otherwise
            # shift the case-pattern match off the real filename and skip the
            # cap silently. Putting the free-form name last means it absorbs
            # any spaces instead of corrupting the split.
            while IFS=' ' read -r size name; do
              [ -n "$size" ] || continue
              case "$size" in
                ''|*[!0-9]*)
                  echo "::error::Glyndor/$p's release asset $name has a non-numeric size ($size) — refusing to compare it against the byte caps"
                  exit 1
                  ;;
              esac
              case "$name" in
                *.deb)
                  if [ "$size" -gt "$MAX_DEB_BYTES" ]; then
                    echo "::error::Glyndor/$p's release asset $name is $size bytes, over the ${MAX_DEB_BYTES}-byte .deb cap"
                    exit 1
                  fi
                  ;;
                *.sig)
                  if [ "$size" -gt "$MAX_SIG_BYTES" ]; then
                    echo "::error::Glyndor/$p's release asset $name is $size bytes, over the ${MAX_SIG_BYTES}-byte .sig cap"
                    exit 1
                  fi
                  ;;
              esac
            done <<< "$assets"
            mkdir -p "debs/$p"
            for arch in $product_archs; do
              before=$(find "debs/$p" -maxdepth 1 -name "*_${arch}.deb" | wc -l)
              # Pull the package and its detached release signature together; the
              # signature is verified before the package enters the archive.
              # A missing or failed download is a hard error: with `aws s3 sync
              # --delete` below, silently skipping a product would evict it from
              # the served archive on the next publish. Download the tag pinned
              # above, not "latest" again, so every arch comes from the same
              # release.
              if ! gh release download "$tag" --repo "Glyndor/$p" \
                   --pattern "*_${arch}.deb" --pattern "*_${arch}.deb.sig" \
                   --dir "debs/$p" --clobber; then
                echo "::error::could not download the ${arch} .deb (+.sig) of Glyndor/$p's $tag release; refusing to publish an archive that would drop it"
                exit 1
              fi
              after=$(find "debs/$p" -maxdepth 1 -name "*_${arch}.deb" | wc -l)
              if [ "$((after - before))" -ne 1 ]; then
                echo "::error::Glyndor/$p's $tag release must attach exactly one ${arch} .deb (got $((after - before)))"
                exit 1
              fi
              echo "downloaded $arch .deb for $p"
            done
            echo "::endgroup::"
            # A product must never ship a keyring-named asset — the real keyring
            # is built locally below. verify-debs.sh hard-fails the publish on
            # this filename rather than the asset being silently dropped here,
            # which would evict that product from the archive with no signal.
            # Reject any oversized package or signature before it is verified
            # or served — belt-and-braces alongside the pre-download check
            # above, in case the advertised size ever disagrees with the
            # delivered bytes.
            while IFS= read -r f; do
              sz=$(stat -c%s "$f")
              case "$f" in
                *.sig)
                  if [ "$sz" -gt "$MAX_SIG_BYTES" ]; then
                    echo "::error::$f is $sz bytes, over the ${MAX_SIG_BYTES}-byte signature cap"
                    exit 1
                  fi
                  ;;
                *)
                  if [ "$sz" -gt "$MAX_DEB_BYTES" ]; then
                    echo "::error::$f is $sz bytes, over the ${MAX_DEB_BYTES}-byte per-package cap"
                    exit 1
                  fi
                  ;;
              esac
            done < <(find "debs/$p" -maxdepth 1 -type f \( -name '*.deb' -o -name '*.deb.sig' \))
          done
          count=$(find debs -mindepth 2 -maxdepth 2 -name '*.deb' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::no product .deb files were downloaded; refusing to publish an empty repo"
            exit 1
          fi
          echo "collected $count product package(s)"

      - name: Verify product .deb release signatures
        run: |
          set -euo pipefail
          # Bind each verified .deb to the product directory it was downloaded
          # into. The release key is shared by every product, so a valid
          # signature alone does not prove a .deb is the product it claims to
          # be — a compromised release could otherwise ship an asset that
          # impersonates another product.
          for spec in $PRODUCTS; do
            p="${spec%%:*}"
            ./scripts/verify-debs.sh "debs/$p" keyring/glyndor-release-ed25519.b64 "$p"
          done
          # Flatten the per-product, now-verified .deb files into a single
          # directory for reprepro and the keyring build below.
          find debs -mindepth 2 -maxdepth 2 -name '*.deb' -exec mv -t debs {} +

      - name: Build keyring package
        run: ./scripts/build-keyring.sh debs

      - name: Build signed apt repository
        env:
          GLYNDOR_APT_GPG_PRIVATE_KEY: ${{ secrets.GLYNDOR_APT_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$GLYNDOR_APT_GPG_PRIVATE_KEY" ]; then
            echo "::error::GLYNDOR_APT_GPG_PRIVATE_KEY secret is not configured."
            exit 1
          fi
          ./scripts/build-repo.sh public debs/*.deb
          # The keyring package is also offered at the repo root for first-time
          # bootstrap (curl + dpkg -i before apt knows the repo).
          cp debs/glyndor-archive-keyring.deb public/glyndor-archive-keyring.deb

      - name: Build the bootstrap installers
        run: |
          set -euo pipefail
          # One script per product in PRODUCTS, generated from a single template
          # so a fix reaches every product at once. Served from here rather than
          # as a release asset because the script does not change when a product
          # cuts a version - and as an asset, a fix to the installer could not
          # reach anyone until the next tag.
          #
          # PRODUCTS entries may carry an architecture spec ("klyradb:amd64").
          # The installer does not care which architectures a product ships -
          # apt resolves that - so strip the suffix before passing the names on.
          installers=""
          for spec in $PRODUCTS; do
            installers="$installers ${spec%%:*}"
          done
          # shellcheck disable=SC2086
          ./scripts/build-installers.sh public/install $installers

      - name: Publish to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.GLYNDOR_APT_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GLYNDOR_APT_R2_SECRET_ACCESS_KEY }}
          GLYNDOR_APT_R2_ENDPOINT: ${{ secrets.GLYNDOR_APT_R2_ENDPOINT }}
          # R2 ignores the region but the AWS CLI requires one to be set.
          AWS_DEFAULT_REGION: auto
        run: |
          # Fail closed if any R2 credential is missing rather than syncing to
          # the wrong place (or nowhere) silently.
          for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY GLYNDOR_APT_R2_ENDPOINT; do
            eval "[ -n \"\${$v:-}\" ]" \
              || { echo "::error::$v is not configured."; exit 1; }
          done
          # Three passes: the Cache-Control differs per file class, and the
          # ordering keeps the live archive consistent for clients mid-publish —
          # new packages land before the metadata that references them, and old
          # packages are removed only after the metadata stopped referencing
          # them, so the signed index never points at a package that 404s. That
          # ordering is necessary and not sufficient: it says nothing about an
          # index file being removed after it is written, which is what #47/#53
          # were — hence the read-back verification that closes this job.
          #   - pool/ .debs are immutable (the filename carries the version), so
          #     cache them for a year — they never change once published.
          #   - everything else (the dists/ metadata, index.html, the keyring
          #     .deb) shares a fixed name but changes every rebuild. Cache it a
          #     day AND purge it from Cloudflare below on every publish, so a
          #     fresh release is visible at once; the long TTL is safe because
          #     each rebuild (daily + manual) purges, and nothing changes between
          #     rebuilds — it just cuts needless origin revalidations.
          #
          # Passes 1 and 3 use --size-only: a product .deb is built once and
          # published, and its version is baked into the filename, so a size
          # match is sufficient proof pool/ already carries the same object.
          #
          # That reasoning covers product .debs and nothing else, which is the
          # part that bit. The keyring package is ALSO in pool/ and is NOT a
          # release — publish.yml rebuilds it every run, under a filename that
          # only moves when the signing key changes. So "same name, same size,
          # different content" needs no immutability violation to happen here;
          # it just needs a non-deterministic build, which is what #55 was. When
          # the rebuild landed on the same size, --size-only skipped the upload
          # while reprepro had already written the new hash into the signed
          # index, and the archive served a package its own index rejected.
          # build-keyring.sh is reproducible now (stamped from the key's commit,
          # locked by tests/build-keyring.test.sh), which is what makes
          # --size-only sound for that object too. If anything else that is
          # regenerated per run is ever added under pool/, it needs the same
          # property or it does not belong in these passes.
          #
          # Pass 2 keeps the default comparison (size + modification time; the
          # AWS CLI never content-hashes) — the dists/ metadata and the
          # bucket-root keyring copy are rewritten every rebuild and land with a
          # current mtime, so a re-signed index always re-uploads.
          #
          # Pass 2 carries no --delete, and must not gain one back. With it,
          # sync emitted an upload AND a delete for the same key in the same
          # pass and let them race: run 29718989917 uploaded binary-arm64's
          # Packages at .2227 and deleted it at .2682, leaving the freshly
          # signed index declaring a file the bucket no longer had. Every key it
          # did that to was a strict prefix of a sibling (Packages of
          # Packages.gz, Release of Release.gpg) and no other key ever was, so
          # the comparator appears to classify a prefix key as local-only and
          # remote-only at once. This is what #47 actually was — not the R2
          # visibility lag recorded there at the time.
          #
          # Do NOT "fix" this by splitting the pass into upload-then-delete:
          # that makes the delete deterministically last and turns an
          # intermittent breakage into one on every publish. Dropping --delete
          # removes the race outright; the cost is that an index file reprepro
          # stops emitting lingers in the bucket, which is harmless because apt
          # only ever fetches what the signed InRelease declares.
          #
          # Pass 3 keeps its --delete: superseded .debs are real storage that
          # has to go, no pool filename is a prefix of another (they all end in
          # .deb and differ before it), and the read-back check at the end of
          # this job verifies the pool too, so a recurrence there would be loud
          # rather than silent.
          # 1. Upload new pool/ packages (no deletions yet).
          aws s3 sync public/ s3://glyndor-apt/ \
            --endpoint-url "$GLYNDOR_APT_R2_ENDPOINT" \
            --no-progress --size-only \
            --exclude "*" --include "pool/*" \
            --cache-control "public, max-age=31536000, immutable"
          # 2. Publish the new metadata. Deliberately NOT --delete: see below.
          aws s3 sync public/ s3://glyndor-apt/ \
            --endpoint-url "$GLYNDOR_APT_R2_ENDPOINT" \
            --no-progress \
            --exclude "pool/*" \
            --cache-control "public, max-age=86400"
          # 3. Remove pool/ packages the new metadata no longer references.
          aws s3 sync public/ s3://glyndor-apt/ \
            --endpoint-url "$GLYNDOR_APT_R2_ENDPOINT" \
            --delete --no-progress --size-only \
            --exclude "*" --include "pool/*" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Purge Cloudflare cache (mutable, fixed-name files)
        env:
          CF_TOKEN: ${{ secrets.GLYNDOR_CF_PURGE_TOKEN }}
          CF_ZONE: ${{ secrets.GLYNDOR_CF_ZONE_ID }}
        run: |
          # The list is derived from the Release and Packages this run built,
          # and split across requests because Cloudflare takes at most 30 URLs
          # each. The zone is shared (apt.glyndor.net is a subdomain of
          # glyndor.net), so this purges by URL and never purge_everything.
          #
          # It used to be inline here, and it refused to send more than 30 with
          # a message saying the list "needed to be sent in batches" — which it
          # never did. That ceiling is reached by the roster in the product
          # context on three architectures, and it would have failed the run
          # AFTER the sync, leaving a fresh archive behind a stale edge cache.
          # tests/purge-cache.test.sh covers the batching and the fail-closed
          # paths.
          ./scripts/purge-cache.sh "$ARCHIVE_URL" public

      - name: Verify the published archive matches the signed index
        run: |
          # Everything above verifies the inputs and then trusts the output. A
          # publish has finished green with the signed index declaring an arm64
          # index file that the archive answered with 404, and it stayed that way
          # until the next scheduled run (issue #47). Read the archive back and
          # fail the run when what is served disagrees with what was signed, so
          # the breakage is known in a minute instead of in a day.
          #
          # This is detection, not preservation: by now the sync has already
          # replaced the metadata and dropped the pool entries the new metadata
          # stopped referencing, so there is no earlier state left to fall back
          # to. A red run and a forward fix is the archive's policy everywhere
          # else, and it is what this buys.
          #
          # It runs after the purge, not before: checking while the edge still
          # holds the previous metadata would compare a fresh signature against
          # stale bytes. The script retries internally to cover that purge being
          # asynchronous — that alone, since the R2 visibility lag it was also
          # written for turned out not to exist (#53).
          ./scripts/verify-published.sh "$ARCHIVE_URL"
