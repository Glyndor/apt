name: Publish apt repository

# Rebuilds the signed apt repository at https://apt.glyndor.net from the latest
# release of each Glyndor product and publishes it to Cloudflare R2 (primary)
# and the gh-pages branch (migration fallback; removed once R2 is verified live).
#
# Triggered manually, on a daily schedule, and by a repository_dispatch event
# (type: product-released) that a product's release workflow can send so the
# repository refreshes immediately after a new version ships.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
  repository_dispatch:
    types: [product-released]

permissions:
  contents: read

env:
  # Space-separated list of Glyndor repos that publish a .deb release asset
  # named <name>_<version>_<arch>.deb. Add a repo here once it ships one.
  PRODUCTS: "podup"
  # Architectures to collect and serve. Must match the reprepro distribution
  # (build/build-repo.sh) and keyring/glyndor.sources.
  ARCHITECTURES: "amd64 arm64"

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install reprepro and the signature verifier
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq reprepro python3-cryptography

      - name: Download the latest .deb of each product
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p debs
          for p in $PRODUCTS; do
            echo "::group::$p"
            got=0
            for arch in $ARCHITECTURES; do
              # Pull the package and its detached release signature together; the
              # signature is verified before the package enters the archive.
              if gh release download --repo "Glyndor/$p" \
                   --pattern "*_${arch}.deb" --pattern "*_${arch}.deb.sig" \
                   --dir debs --clobber 2>/dev/null; then
                echo "downloaded $arch .deb for $p"
                got=1
              else
                echo "::warning::no $arch .deb release asset for Glyndor/$p"
              fi
            done
            [ "$got" -eq 1 ] || echo "::warning::no .deb release asset found for Glyndor/$p — skipping"
            echo "::endgroup::"
          done
          count=$(find debs -name '*.deb' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::no product .deb files were downloaded; refusing to publish an empty repo"
            exit 1
          fi
          echo "collected $count product package(s)"

      - name: Verify product .deb release signatures
        run: ./build/verify-debs.sh debs

      - name: Build keyring package
        run: ./build/build-keyring.sh debs

      - name: Build signed apt repository
        env:
          GLYNDOR_APT_GPG_PRIVATE_KEY: ${{ secrets.GLYNDOR_APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GLYNDOR_APT_GPG_PRIVATE_KEY" ]; then
            echo "::error::GLYNDOR_APT_GPG_PRIVATE_KEY secret is not configured."
            exit 1
          fi
          ./build/build-repo.sh public debs/*.deb
          # The keyring package is also offered at the repo root for first-time
          # bootstrap (curl + dpkg -i before apt knows the repo).
          cp debs/glyndor-archive-keyring.deb public/glyndor-archive-keyring.deb

      - name: Publish to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.GLYNDOR_APT_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GLYNDOR_APT_R2_SECRET_ACCESS_KEY }}
          GLYNDOR_APT_R2_ENDPOINT: ${{ secrets.GLYNDOR_APT_R2_ENDPOINT }}
        run: |
          aws s3 sync public/ s3://glyndor-apt/ \
            --endpoint-url "$GLYNDOR_APT_R2_ENDPOINT" \
            --delete \
            --no-progress

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd public
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publish apt repository"
          git branch -M gh-pages
          git push -f \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
