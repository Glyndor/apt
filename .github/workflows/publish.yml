name: Publish apt repository

# Rebuilds the signed apt repository at https://apt.glyndor.net from the latest
# release of each Glyndor product and publishes it to Cloudflare R2.
#
# Runs once a day and on demand. A new product release is picked up at the
# next scheduled build (or a manual run), so no product needs a write credential
# on this repository to trigger a refresh.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

# Serialise publishes. The daily schedule and a manual run can otherwise
# overlap and run two `aws s3 sync --delete` against the same bucket at once,
# racing to a half-deleted, inconsistent index that apt rejects. Never cancel a
# run in flight — a partial sync must always finish.
concurrency:
  group: publish-apt
  cancel-in-progress: false

env:
  # Space-separated list of Glyndor repos that publish a .deb release asset
  # named <name>_<version>_<arch>.deb. Add a repo here once it ships one.
  PRODUCTS: "podup"
  # Architectures to collect and serve. Must match the reprepro distribution
  # (scripts/build-repo.sh) and keyring/glyndor.sources.
  ARCHITECTURES: "amd64 arm64"

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so build-keyring.sh can derive the keyring package
          # version from the date the signing key last changed.
          fetch-depth: 0

      - name: Install reprepro and the signature verifier
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq reprepro python3-cryptography

      - name: Download the latest .deb of each product
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p debs
          # The release assets are attacker-influenced (whoever can publish a
          # product release controls them). The signature check bounds their
          # authenticity but not their volume, so bound count and size here:
          # exactly one .deb per product per arch, and a hard per-file size cap,
          # so a compromised or buggy release can't exhaust runner disk or bloat
          # the served archive. Each product also gets its own directory, so its
          # assets can be verified against its own name below rather than
          # trusted on signature alone.
          MAX_DEB_BYTES=$((300 * 1024 * 1024))
          MAX_SIG_BYTES=4096
          for p in $PRODUCTS; do
            echo "::group::$p"
            # Resolve "latest" exactly once per product and reuse that tag for
            # every arch below. Without this, each `gh release download` call
            # re-resolves "latest" independently, so a release landing mid-run
            # can hand amd64 and arm64 two different tags — a mixed-version
            # archive with no signal that anything went wrong.
            tag="$(gh release view --repo "Glyndor/$p" --json tagName --jq .tagName)" \
              || { echo "::error::could not resolve Glyndor/$p's latest release tag"; exit 1; }
            echo "pinned $p to release $tag"
            # Check the sizes the release actually advertises before pulling
            # any bytes, so an oversized asset can't exhaust runner disk mid-
            # download — the post-download check below is belt-and-braces in
            # case the advertised size ever disagrees with the delivered one.
            assets="$(gh release view "$tag" --repo "Glyndor/$p" --json assets \
                        --jq '.assets[] | "\(.size) \(.name)"')" \
              || { echo "::error::could not list Glyndor/$p's release assets to check sizes before download"; exit 1; }
            # Emit size before name and read name last: an attacker picks the
            # asset name, and `read` splits on the first space(s) into all but
            # the last variable, so a name containing a space would otherwise
            # shift the case-pattern match off the real filename and skip the
            # cap silently. Putting the free-form name last means it absorbs
            # any spaces instead of corrupting the split.
            while IFS=' ' read -r size name; do
              [ -n "$size" ] || continue
              case "$size" in
                ''|*[!0-9]*)
                  echo "::error::Glyndor/$p's release asset $name has a non-numeric size ($size) — refusing to compare it against the byte caps"
                  exit 1
                  ;;
              esac
              case "$name" in
                *.deb)
                  if [ "$size" -gt "$MAX_DEB_BYTES" ]; then
                    echo "::error::Glyndor/$p's release asset $name is $size bytes, over the ${MAX_DEB_BYTES}-byte .deb cap"
                    exit 1
                  fi
                  ;;
                *.sig)
                  if [ "$size" -gt "$MAX_SIG_BYTES" ]; then
                    echo "::error::Glyndor/$p's release asset $name is $size bytes, over the ${MAX_SIG_BYTES}-byte .sig cap"
                    exit 1
                  fi
                  ;;
              esac
            done <<< "$assets"
            mkdir -p "debs/$p"
            for arch in $ARCHITECTURES; do
              before=$(find "debs/$p" -maxdepth 1 -name "*_${arch}.deb" | wc -l)
              # Pull the package and its detached release signature together; the
              # signature is verified before the package enters the archive.
              # A missing or failed download is a hard error: with `aws s3 sync
              # --delete` below, silently skipping a product would evict it from
              # the served archive on the next publish. Download the tag pinned
              # above, not "latest" again, so every arch comes from the same
              # release.
              if ! gh release download "$tag" --repo "Glyndor/$p" \
                   --pattern "*_${arch}.deb" --pattern "*_${arch}.deb.sig" \
                   --dir "debs/$p" --clobber; then
                echo "::error::could not download the ${arch} .deb (+.sig) of Glyndor/$p's $tag release; refusing to publish an archive that would drop it"
                exit 1
              fi
              after=$(find "debs/$p" -maxdepth 1 -name "*_${arch}.deb" | wc -l)
              if [ "$((after - before))" -ne 1 ]; then
                echo "::error::Glyndor/$p's $tag release must attach exactly one ${arch} .deb (got $((after - before)))"
                exit 1
              fi
              echo "downloaded $arch .deb for $p"
            done
            echo "::endgroup::"
            # A product must never ship a keyring-named asset — the real keyring
            # is built locally below. verify-debs.sh hard-fails the publish on
            # this filename rather than the asset being silently dropped here,
            # which would evict that product from the archive with no signal.
            # Reject any oversized package or signature before it is verified
            # or served — belt-and-braces alongside the pre-download check
            # above, in case the advertised size ever disagrees with the
            # delivered bytes.
            while IFS= read -r f; do
              sz=$(stat -c%s "$f")
              case "$f" in
                *.sig)
                  if [ "$sz" -gt "$MAX_SIG_BYTES" ]; then
                    echo "::error::$f is $sz bytes, over the ${MAX_SIG_BYTES}-byte signature cap"
                    exit 1
                  fi
                  ;;
                *)
                  if [ "$sz" -gt "$MAX_DEB_BYTES" ]; then
                    echo "::error::$f is $sz bytes, over the ${MAX_DEB_BYTES}-byte per-package cap"
                    exit 1
                  fi
                  ;;
              esac
            done < <(find "debs/$p" -maxdepth 1 -type f \( -name '*.deb' -o -name '*.deb.sig' \))
          done
          count=$(find debs -mindepth 2 -maxdepth 2 -name '*.deb' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::no product .deb files were downloaded; refusing to publish an empty repo"
            exit 1
          fi
          echo "collected $count product package(s)"

      - name: Verify product .deb release signatures
        run: |
          set -euo pipefail
          # Bind each verified .deb to the product directory it was downloaded
          # into. The release key is shared by every product, so a valid
          # signature alone does not prove a .deb is the product it claims to
          # be — a compromised release could otherwise ship an asset that
          # impersonates another product.
          for p in $PRODUCTS; do
            ./scripts/verify-debs.sh "debs/$p" keyring/glyndor-release-ed25519.b64 "$p"
          done
          # Flatten the per-product, now-verified .deb files into a single
          # directory for reprepro and the keyring build below.
          find debs -mindepth 2 -maxdepth 2 -name '*.deb' -exec mv -t debs {} +

      - name: Build keyring package
        run: ./scripts/build-keyring.sh debs

      - name: Build signed apt repository
        env:
          GLYNDOR_APT_GPG_PRIVATE_KEY: ${{ secrets.GLYNDOR_APT_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$GLYNDOR_APT_GPG_PRIVATE_KEY" ]; then
            echo "::error::GLYNDOR_APT_GPG_PRIVATE_KEY secret is not configured."
            exit 1
          fi
          ./scripts/build-repo.sh public debs/*.deb
          # The keyring package is also offered at the repo root for first-time
          # bootstrap (curl + dpkg -i before apt knows the repo).
          cp debs/glyndor-archive-keyring.deb public/glyndor-archive-keyring.deb

      - name: Publish to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.GLYNDOR_APT_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GLYNDOR_APT_R2_SECRET_ACCESS_KEY }}
          GLYNDOR_APT_R2_ENDPOINT: ${{ secrets.GLYNDOR_APT_R2_ENDPOINT }}
          # R2 ignores the region but the AWS CLI requires one to be set.
          AWS_DEFAULT_REGION: auto
        run: |
          # Fail closed if any R2 credential is missing rather than syncing to
          # the wrong place (or nowhere) silently.
          for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY GLYNDOR_APT_R2_ENDPOINT; do
            eval "[ -n \"\${$v:-}\" ]" \
              || { echo "::error::$v is not configured."; exit 1; }
          done
          # Three passes: the Cache-Control differs per file class, and the
          # ordering keeps the live archive consistent for clients mid-publish —
          # new packages land before the metadata that references them, and old
          # packages are removed only after the metadata stopped referencing
          # them, so the signed index never points at a 404.
          #   - pool/ .debs are immutable (the filename carries the version), so
          #     cache them for a year — they never change once published.
          #   - everything else (the dists/ metadata, index.html, the keyring
          #     .deb) shares a fixed name but changes every rebuild. Cache it a
          #     day AND purge it from Cloudflare below on every publish, so a
          #     fresh release is visible at once; the long TTL is safe because
          #     each rebuild (daily + manual) purges, and nothing changes between
          #     rebuilds — it just cuts needless origin revalidations.
          # 1. Upload new pool/ packages (no deletions yet).
          aws s3 sync public/ s3://glyndor-apt/ \
            --endpoint-url "$GLYNDOR_APT_R2_ENDPOINT" \
            --no-progress \
            --exclude "*" --include "pool/*" \
            --cache-control "public, max-age=31536000, immutable"
          # 2. Publish the new metadata (and clean up stale non-pool files).
          aws s3 sync public/ s3://glyndor-apt/ \
            --endpoint-url "$GLYNDOR_APT_R2_ENDPOINT" \
            --delete --no-progress \
            --exclude "pool/*" \
            --cache-control "public, max-age=86400"
          # 3. Remove pool/ packages the new metadata no longer references.
          aws s3 sync public/ s3://glyndor-apt/ \
            --endpoint-url "$GLYNDOR_APT_R2_ENDPOINT" \
            --delete --no-progress \
            --exclude "*" --include "pool/*" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Purge Cloudflare cache (mutable, fixed-name files)
        env:
          CF_TOKEN: ${{ secrets.GLYNDOR_CF_PURGE_TOKEN }}
          CF_ZONE: ${{ secrets.GLYNDOR_CF_ZONE_ID }}
        run: |
          set -euo pipefail
          # Cloudflare caches the index by URL; a fresh sync changes the bytes
          # behind the same URL, so without a purge apt can fetch a new InRelease
          # but a stale Packages it no longer matches (hash/size mismatch). Purge
          # the mutable, fixed-name files; the immutable pool/ .debs are never
          # purged. The zone is shared (apt.glyndor.net is a subdomain of
          # glyndor.net), so purge by URL — never purge_everything.
          for v in CF_TOKEN CF_ZONE; do
            eval "[ -n \"\${$v:-}\" ]" \
              || { echo "::error::$v is not configured."; exit 1; }
          done
          base="https://apt.glyndor.net"
          urls=$(printf '"%s",' \
            "$base/dists/stable/InRelease" \
            "$base/dists/stable/Release" \
            "$base/dists/stable/Release.gpg" \
            "$base/dists/stable/main/binary-amd64/Packages" \
            "$base/dists/stable/main/binary-amd64/Packages.gz" \
            "$base/dists/stable/main/binary-amd64/Packages.xz" \
            "$base/dists/stable/main/binary-arm64/Packages" \
            "$base/dists/stable/main/binary-arm64/Packages.gz" \
            "$base/dists/stable/main/binary-arm64/Packages.xz" \
            "$base/glyndor-archive-keyring.deb" \
            "$base/index.html")
          urls="${urls%,}"
          # Pass the token via a header file, not argv: an -H argument is
          # world-visible in /proc/<pid>/cmdline for the lifetime of the call.
          hdr=$(mktemp)
          trap 'rm -f "$hdr"' EXIT
          printf 'Authorization: Bearer %s\n' "$CF_TOKEN" > "$hdr"
          resp=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H @"$hdr" \
            -H "Content-Type: application/json" \
            --data "{\"files\":[$urls]}")
          echo "$resp" | grep -q '"success":true' \
            || { echo "::error::Cloudflare purge failed: $resp"; exit 1; }
          echo "Cloudflare cache purged for the apt metadata."
