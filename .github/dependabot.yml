version: 2

updates:
  # Keep the SHA-pinned actions in the workflows current. This repo has no
  # language package manifest (it is POSIX shell + reprepro), so GitHub Actions
  # is the only ecosystem to track.
  # nosemgrep: dependabot-missing-cooldown -- deliberately no cooldown. The rule
  # assumes an open package ecosystem and a moving tag; here every action is
  # SHA-pinned and GitHub- or Glyndor-owned, no automation auto-merges anything
  # (measured across the org: no workflow arms auto-merge or even references
  # Dependabot), and the owner reviews every bump before it lands. Holding a
  # security bump back for a week costs more than it buys. Removed on purpose in
  # #67 -- do not "fix" this by adding a cooldown block.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels: ["type:deps", "type:ci"]
    open-pull-requests-limit: 10
    # Action references are pinned by SHA: without grouping, one upstream
    # release day means several near-identical pull requests and several full
    # CI runs on a repository whose CI publishes a signed apt archive. One
    # pull request per day is enough to review the same information.
    #
    # This used to be split in two. The Glyndor reusables and the actions/*
    # got opposite answers from the same review -- a .github release usually
    # changed nothing this repository called, and those bumps came back
    # byte-identical and were closed as no-ops (#94, #107, #108 in the month
    # to 23 August 2026), while actions/checkout moving is the one thing here
    # worth reading line by line. Under a single group both arrived in one
    # pull request, so closing the no-op closed the bump that mattered.
    #
    # That split has nothing left to separate. #125 made this repository
    # self-contained: every reusable it calls now lives here, so no
    # `Glyndor/.github` reference survives for the pattern to match. The
    # group matched nothing and its companion exclusion excluded nothing --
    # a config claiming coverage it does not have.
    #
    # The group is named for what it matches. `patterns: ["*"]` selects every
    # dependency in the ecosystem, so the name says that and nothing more. It
    # was `github-owned` for a week, and that was true only by accident: every
    # non-local `uses:` here happens to be an actions/* today, and the first
    # one that is not would have landed in a group whose name said otherwise.
    groups:
      actions:
        patterns: ["*"]
    # Dependabot infers a prefix from the commit history when this is absent,
    # and the inference has been unstable across repositories (build(deps):
    # Bump ... in some, chore(deps): bump ... in others). Set it so the
    # generated title is predictable and matches homebrew-tap and scoop-bucket.
    commit-message:
      prefix: chore
