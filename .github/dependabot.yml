version: 2

updates:
  # Keep the SHA-pinned actions in the workflows current. This repo has no
  # language package manifest (it is POSIX shell + reprepro), so GitHub Actions
  # is the only ecosystem to track.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels: ["type:deps", "type:ci"]
    open-pull-requests-limit: 10
    # Six action references across six workflows, all pinned by SHA: without
    # grouping, one upstream release day means six near-identical pull requests
    # and six full CI runs on a repo whose CI publishes a signed apt repository.
    # One pull request per day is enough to review the same information.
    groups:
      actions:
        patterns: ["*"]
