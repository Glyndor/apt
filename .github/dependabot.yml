version: 2

updates:
  # Keep the SHA-pinned actions in the workflows current. This repo has no
  # language package manifest (it is POSIX shell + reprepro), so GitHub Actions
  # is the only ecosystem to track.
  # nosemgrep: dependabot-missing-cooldown -- deliberately no cooldown. The rule
  # assumes an open package ecosystem and a moving tag; here every action is
  # SHA-pinned and GitHub- or Glyndor-owned, no automation auto-merges anything
  # (measured across the org: no workflow arms auto-merge or even references
  # Dependabot), and the owner reviews every bump before it lands. Holding a
  # security bump back for a week costs more than it buys. Removed on purpose in
  # #67 -- do not "fix" this by adding a cooldown block.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels: ["type:deps", "type:ci"]
    open-pull-requests-limit: 10
    # Six action references across six workflows, all pinned by SHA: without
    # grouping, one upstream release day means six near-identical pull requests
    # and six full CI runs on a repo whose CI publishes a signed apt repository.
    # One pull request per day is enough to review the same information.
    groups:
      actions:
        patterns: ["*"]
